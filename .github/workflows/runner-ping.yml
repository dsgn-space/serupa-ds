name: Runner ping

# Run this once after bringing the project's x86 machines up (infra/ibm-burst-runner/up.sh). CI, Nightly,
# Cross-browser and Update baselines send x86 jobs to the machines only while a self-hosted runner has started a job in
# the last 100 minutes (tools/runner-watch.mjs --pick), so new machines get no work until one does. This job is that
# start: a few seconds on one runner. It runs only by hand: run every hour, it kept the burst VM busy so its idle
# watchdog never deleted it, and the VM ran day and night (to 23 November). The machines take work while there is
# some and then delete themselves; with them gone, every job runs on GitHub's runners.
on:
  workflow_dispatch:

concurrency:
  group: runner-ping
  cancel-in-progress: true

permissions: {}

jobs:
  ping:
    runs-on: ${{ fromJSON(vars.SERUPA_X86_RUNNER || '"ubuntu-24.04"') }}
    timeout-minutes: 5
    steps:
      - run: echo "Started on $RUNNER_NAME"
