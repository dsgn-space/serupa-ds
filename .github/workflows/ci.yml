name: CI

# How a change is tested on its way to main:
# - A pull request's own run is the quick check: build, types and lint, the fix proof, the checks, and the tests (in
#   English), Visual and Storybook checks of the components it changes (narrowed against the main it merges onto). The
#   tests in the other languages, consumer and frameworks are left to the merge queue. Firefox and WebKit are tested
#   nightly (cross-browser.yml): a difference there doesn't block a merge, so the queue doesn't wait on it.
# - The merge queue runs every job on the commit that becomes main, for a group of up to five pull requests at once,
#   with the tests narrowed as a pull request's are, against the group before it (or main): what the group's own change
#   can affect, on the exact tree it makes. Main's push run is then build only (the Storybook artifact, and the Release
#   workflow waits on it). Every night the flake hunt tests main whole, unnarrowed, with the coverage floors (nightly.yml).
# - Without a merge queue (repository variable SERUPA_QUEUE not "1"), a pull request and main both run everything.
# - Every job runs in Playwright's Ubuntu 24.04 image, capped at 4 CPUs, on GitHub's runners or on the project's own
#   (repository variables SERUPA_RUNNER and SERUPA_X86_RUNNER, JSON: '["self-hosted","linux","x86"]'). Jobs with a
#   screenshot or a timing budget take SERUPA_X86_RUNNER: the baselines are drawn with Chrome for Testing on x64. A pull
#   request from a fork always runs on GitHub's runners, so code nobody has merged never runs on the project's machines.
#   The x86 jobs take SERUPA_X86_RUNNER for the merge queue, main and same-repository pull requests (up to eight at once).
#   In the merge queue every other job takes the x86 runners too (the plan job's x86runner, which falls back to
#   GitHub's runners when ours look gone): on 15 Nov GitHub's runners started the queue's build 13 minutes late and
#   then not at all, while the 28 burst slots sat idle and nothing merged. Pull requests keep SERUPA_RUNNER.
# - Results are kept: a job that passed on the same tree, against the same base, passes again at once without running.
# - The nightly jobs are in nightly.yml. No workflow_dispatch: a run started by hand runs in the default branch's
#   cache scope on any ref, which CodeQL rightly counts as cache poisoning; the nightly runs main whole instead.

on:
  pull_request:
  merge_group:
  push:
    # main, and the previous major's maintenance branch (14.x) for the 28 days after a major, which the Release
    # workflow releases from too.
    branches: [main, '[0-9]*.x']

# A new push to a pull request cancels the run before it. Queue and main runs all finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Chrome for Testing at the version browsers.json names, which tools/setup.mjs installs and the setup action caches.
  # The image's own /ms-playwright holds a later patch of that revision, which tools/test/visual.mjs refuses.
  PLAYWRIGHT_BROWSERS_PATH: /github/home/.cache/ms-playwright

jobs:
  # What this run tests: whole or narrowed, and which suite jobs it needs.
  plan:
    if: github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      hold: ${{ steps.hold.outputs.hold }}
      x86runner: ${{ steps.runner.outputs.x86runner }}
      prrunner: ${{ steps.runner.outputs.prrunner }}
      wide: ${{ steps.plan.outputs.wide }}
      full: ${{ steps.plan.outputs.full }}
      since: ${{ steps.plan.outputs.since }}
      x86: ${{ steps.plan.outputs.x86 }}
      x86any: ${{ steps.plan.outputs.x86any }}
      portable: ${{ steps.plan.outputs.portable }}
      tests: ${{ steps.plan.outputs.tests }}
      visual: ${{ steps.plan.outputs.visual }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      # For tools/test/run.mjs --list (no npm ci: it needs Node alone).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Held: the pull request carries the update-visual-baselines label, so Update baselines is drawing its pictures
      # now and will push them (a new run) or, with nothing to change, start this run again once the label is off.
      # Testing this commit meanwhile would only be done twice. The bot's own picture commit is never held.
      - id: hold
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          subject=$(git log -1 --format=%s HEAD^2)
          labels=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/labels" --jq '.[].name')
          # Heal's merge isn't held: it adds no Chromium redraw label any more (ADR-0016), so its run tests it.
          if [ "$subject" != "Update test baselines on the CI runner" ] && grep -qx update-visual-baselines <<< "$labels"; then
            echo "hold=1" >> "$GITHUB_OUTPUT"
            echo "Held: Update baselines is drawing this pull request's pictures; CI runs on its commit, or again here when nothing changed." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      # Where the x86 jobs run: SERUPA_X86_RUNNER (the project's machines) while a self-hosted runner has started a job
      # in the last 100 minutes, GitHub's runners otherwise, and for a fork's pull request or when the variable is unset.
      # The burst VM deletes itself after a day with nothing to do, and a job sent to it then waits a day (tools/runner-watch.mjs
      # --pick; after bringing the machines up, run the Runner ping workflow once so they count).
      - id: runner
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          X86: ${{ vars.SERUPA_X86_RUNNER }}
          FORK: ${{ github.event.pull_request.head.repo.fork == true }}
          EVENT: ${{ github.event_name }}
          PR_RUNNER: ${{ vars.SERUPA_RUNNER || '"ubuntu-24.04"' }}
        run: |
          set -euo pipefail
          if ! runner=$(node tools/runner-watch.mjs --pick 100); then
            runner="${X86:-\"ubuntu-24.04\"}"
            echo "::warning title=Runner check::GitHub didn't answer, so the x86 jobs go to $runner as set."
          elif [ -n "$X86" ] && [ "$FORK" != true ] && [ "$runner" = '"ubuntu-24.04"' ]; then
            echo "::warning title=x86 runners look gone::No self-hosted runner has started a job in 100 minutes, so this run's x86 jobs go to GitHub's runners."
          fi
          echo "x86runner=$(echo "$runner" | tr -d ' \n')" >> "$GITHUB_OUTPUT"
          echo "x86 jobs run on: $runner"
          # A pull request's suite jobs borrow the x86 runners while no merge queue job is waiting for one, so the queue
          # keeps them when it needs them, and otherwise take GitHub's (SERUPA_RUNNER). Waiting for no queue run at all
          # left the 28 burst slots mostly idle while twelve pull request runs queued for GitHub's 20 (15 Nov, 21:40: a
          # run waited 40 minutes). A run decides once, at its start, and holds at most six x86 jobs (max-parallel, three per suite job).
          if [ "$EVENT" = pull_request ]; then
            pr="$PR_RUNNER"
            if [ "$FORK" = true ]; then pr='"ubuntu-24.04"'; fi
            if [ "$FORK" != true ] && [ "$runner" = "$X86" ]; then
              waiting=0
              for s in queued in_progress; do
                for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=merge_group&status=$s&per_page=20" --jq '.workflow_runs[].id') ; do
                  n=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?filter=latest&per_page=100" --jq '[.jobs[] | select(.status == "queued" or .status == "waiting")] | length') || n=1
                  waiting=$(( waiting + n ))
                done
              done
              if [ "$waiting" = 0 ]; then pr="$X86"; fi
              echo "The merge queue has $waiting job(s) waiting for a runner."
            fi
            echo "prrunner=$(echo "$pr" | tr -d ' \n')" >> "$GITHUB_OUTPUT"
            echo "This pull request's x86 jobs run on: $pr"
          fi
      - id: plan
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          QUEUE: ${{ vars.SERUPA_QUEUE }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
          PRRUNNER: ${{ steps.runner.outputs.prrunner }}
        run: |
          set -euo pipefail
          # full: every job runs. wide: the suite runs unnarrowed. tests: the suite runs at all.
          # A queue group runs every job, with the suite narrowed against the group before it (or main): that is the
          # commit its own change lands on, so it tests what the change can affect on the exact tree that becomes main,
          # and five groups don't each run the whole suite again. Main's push run behind the queue is build only; the
          # nightly flake hunt tests main whole, with the coverage floors (nightly.yml).
          full=""; wide=""; since=""; tests=1; ns=""
          case "$EVENT" in
            merge_group) full=1; since="$QUEUE_BASE" ;;
            push) if [ "$QUEUE" = 1 ]; then tests=""; else full=1; wide=1; fi ;;
            pull_request)
              if [ "$QUEUE" = 1 ]; then since="$(git rev-parse HEAD^1)"; else full=1; wide=1; fi ;;
          esac
          # Visual on a narrowed run only when the change touches what a story's picture is built from. A change to how CI
          # runs (this workflow, its actions, Node's version, setup.mjs) or to how the tests are picked (lib.mjs, run.mjs)
          # draws main and the branch alike, so it draws nothing: #2261, one line of this file, drew 311 stories twice in
          # each of four shards, 23 minutes (21 Nov). The nightly flake hunt draws main whole.
          visual=1
          if [ -n "$since" ] && [ "$EVENT" = pull_request ]; then
            if ! git diff --name-only "$since" HEAD | grep -qE '^(src/|docs/|\.storybook/|design-tokens/|tokens/|tokens\.(css|json)$|fonts/|package(-lock)?\.json$|tsconfig\.json$|tsup\.config\.mjs$|README\.md$|CHANGELOG\.md$|\.changeset/[^/]+\.md$|bin/migrate/|tools/(build|tokens|utilities|typescript|icons|fonts)/|tools/test/(visual|storybook)\.mjs$|tools/test/baseline-visual/)'; then visual=""; fi
          fi
          # All the component tests in the other languages run in the merge queue only, on the commit that becomes main: a
          # pull request's own run tests its components in English, with the changed components' own tests in the other
          # languages in the same base jobs (run.mjs), and Visual when the pictures can change: the
          # failures a pull request meets most, so they are found before the queue, where one failure drops every
          # group behind it.
          # Shards: a pull request's run takes 3 base and 5 Visual jobs (8, its max-parallel on GitHub's runners). A queue group has the 28
          # burst slots behind it and gates every merge, so it splits wider: 5 base, 10 locale and 7 Visual,
          # about a third off its longest job (each shard still pays about a minute of setup).
          # Locale in ten: a queue group that tests every component (#2240, 21 Nov) ran every component's tests in all three
          # other languages, and its five locale shards took 13 to 20+ minutes of tests against 6 to 8 for the base ones,
          # the longest jobs of a 40-minute run. Ten bring them level with base; with base, Storybook, checks and the
          # rest that is 27 of the 28 burst slots at once, and a narrowed group still takes one shard per ten components.
          shards() { local g=$1 p=$2 n=$3 out="" k; for k in $(seq 1 "$n"); do out="$out,{\"group\":\"$g\"${p:+,\"part\":\"$p\"},\"shard\":\"$k/$n\"}"; done; echo "$out"; }
          if [ "$EVENT" = merge_group ]; then nb=5; nl=10; nv=7; else nb=3; nl=3; nv=5; fi
          # On the burst runners a pull request runs four x86 jobs at once (max-parallel), so Visual takes four shards:
          # with five, the fifth started after the first wave and a whole run took 47 minutes (#2044, 16 Nov), against
          # about 31 with four (three base and one Visual shard, then the other three).
          if [ "$EVENT" = pull_request ] && [[ "$PRRUNNER" == *self-hosted* ]]; then nv=4; fi
          x86='{"include":['"$(shards components base "$nb" | cut -c2-)"
          if [ "$EVENT" != pull_request ] || [ -z "$since" ]; then
            x86="$x86$(shards components locale "$nl")"
          fi
          # Visual in five shards on a pull request: in four, it was the longest group of a full queue run once Storybook
          # went to four (476 to 490 s against 295 to 435 for the rest, 13 Nov).
          # Not in the merge queue (ADR-0016): a pull request's Visual draws main's pictures and its own and the
          # design-qa label signs the difference off, so no committed picture has to be fresh to merge. The queue
          # checked the committed pictures, which every merge of another picture pull request made stale (15 Nov: 14
          # drops in two hours).
          [ -n "$visual" ] && [ "$EVENT" != merge_group ] && x86="$x86$(shards visual "" "$nv")"
          x86="$x86]}"
          # A narrowed run that leaves a group nothing to test (a change to docs, tools or workflows alone) doesn't
          # start its jobs: each would take a runner, set up and run no test.
          # Storybook's checks (WCAG in every theme, reflow at 320px, the docs pages) on a pull request too, narrowed to the
          # stories it changes like Visual: found only in the queue, one story's failure took whole groups down with it.
          storybook="$full"; [ -n "$visual" ] && storybook=1
          if [ -n "$since" ]; then
            [ "$EVENT" = merge_group ] && git fetch -q --depth=1 origin "$since"
            has() { node tools/test/run.mjs --since "$since" --group "$1" --list | grep -q $'\t'; }
            # Shards scale with what a narrowed run covers: each pays about a minute of setup, so a group that changes
            # two components took 17 jobs of under 30 s of tests each (15 Nov), and the queue's demand for the burst
            # slots, not the tests, set how long a merge took. One shard per ten components covered, up to the counts above.
            covered=$(node tools/test/run.mjs --since "$since" --group components --list | sed -n 's/^Testing the changed components and the ones that use them: \(.*\) (main runs everything)$/\1/p' | tr ',' '\n' | grep -c .) || covered=""
            if [ -n "$covered" ] && [ "$covered" -gt 0 ]; then
              fit() { local n=$(( ($covered + 9) / 10 )); [ "$n" -lt "$1" ] && echo "$n" || echo "$1"; }
              nb2=$(fit "$nb"); nl2=$(fit "$nl"); nv2=$(fit "$nv"); ns=$(fit 4)
              x86=$(echo "$x86" | jq -c --argjson b "$nb2" --argjson l "$nl2" --argjson v "$nv2" '
                def keep(g; p; n): map(select(.group != g or (.part // "") != p or ((.shard | split("/")[0] | tonumber) <= n)) | if .group == g and (.part // "") == p then .shard = ((.shard | split("/")[0]) + "/" + (n | tostring)) else . end);
                .include |= (keep("components"; "base"; $b) | keep("components"; "locale"; $l) | keep("visual"; ""; $v))')
              echo "Covers $covered components: $nb2 base, $nl2 locale, $nv2 Visual and $ns Storybook shards."
            fi
            if ! has components; then x86=$(echo "$x86" | jq -c '.include |= map(select(.group != "components"))'); fi
            if ! has visual; then x86=$(echo "$x86" | jq -c '.include |= map(select(.group != "visual"))'); fi
            if ! has storybook; then storybook=""; fi
          fi
          x86any=$(echo "$x86" | jq -r 'if (.include | length) > 0 then 1 else "" end')
          visualrun=$(echo "$x86" | jq -r 'if any(.include[]; .group == "visual") then 1 else "" end')
          portable='{"include":[{"group":"checks","shard":"1/3"},{"group":"checks","shard":"2/3"},{"group":"checks","shard":"3/3"}'
          # Storybook in four shards: in three, a queue run that checks every page took up to 11 minutes in one (13 Nov),
          # the longest job of the run. They go on GitHub's runners, so a fourth costs no x86 runner.
          if [ -n "$storybook" ]; then for k in $(seq 1 "${ns:-4}"); do portable="$portable"',{"group":"storybook","shard":"'"$k/${ns:-4}"'"}'; done; fi
          portable="$portable]}"
          {
            echo "full=$full"; echo "wide=$wide"; echo "since=$since"; echo "tests=$tests"
            echo "x86=$(echo "$x86" | tr -d ' \n')"; echo "x86any=$x86any"; echo "visual=$visualrun"; echo "portable=$(echo "$portable" | tr -d ' \n')"
          } >> "$GITHUB_OUTPUT"
          echo "full=${full:-no} wide=${wide:-no} since=${since:-none} visual=${visual:-no} tests=${tests:-no}"
          # Size: each pull request costs a CI run, often a redraw and a queue run, so a tiny one belongs in its thread's
          # next batch and a huge one is hard to review and conflicts with everything. Pictures and other baselines
          # don't count. A warning only: it never fails the run.
          if [ "$EVENT" = pull_request ]; then
            lines=$(git diff --numstat HEAD^1 HEAD -- . ':(exclude)tools/test/baseline-*' ':(exclude)package-lock.json' | awk '$1 != "-" { n += $1 + $2 } END { print n + 0 }')
            if [ "$lines" -lt 15 ]; then echo "::warning title=Small pull request::$lines changed lines: fold it into the thread's next batch instead of its own CI run, redraw and queue run."
            elif [ "$lines" -gt 3000 ]; then echo "::warning title=Big pull request::$lines changed lines (pictures aside): split it by component, or expect conflicts and a long review."; fi
          fi

  # Builds the package and Storybook once; every test job downloads them instead of building its own.
  build:
    needs: plan
    if: needs.plan.outputs.hold != '1'
    # actions: write lets a failed build stop its own run (the last step).
    permissions:
      contents: read
      actions: write
    runs-on: ${{ fromJSON(github.event_name == 'merge_group' && needs.plan.outputs.x86runner || (github.event.pull_request.head.repo.fork != true && vars.SERUPA_RUNNER) || '"ubuntu-24.04"') }}
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:9beb546099e11f52d62e505537914870e01a67e0e6b00ae41da4775324e73dbe
      options: --cpus 4
    timeout-minutes: 20
    steps:
      # A job stopped mid-fetch can leave a ref lock in the runner's reused workspace, and every later checkout there
      # fails on it ("cannot lock ref … .lock: File exists", ibm-burst-18, 13 Nov).
      - name: Clear stale git locks
        shell: bash
        run: find .git -name '*.lock' -type f -delete 2>/dev/null || true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: git config --global --add safe.directory "$PWD"
      - uses: ./.github/actions/setup
        with:
          browsers: "false"
      - name: tokens.css is generated from tokens.json
        run: node tools/tokens/build.mjs --check
      - name: Build the package
        run: npm run build
      # The size budgets take seconds once the package is built, and they are what a pull request that passed on its own
      # most often fails in the queue, once another merged ahead of it (#1995 and #1999 by 13 to 31 bytes, 15 Nov). Here
      # they fail a run in about two minutes. The checks group leaves them out on CI (SERUPA_SIZE_IN_BUILD below), where
      # they took 44 to 77 s of a checks shard a second time.
      - name: Sizes within their budgets
        run: node tools/test/size.mjs
      - name: Build Storybook
        run: npm run build-storybook
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build
          path: |
            dist/
            storybook-static/
          retention-days: 3
          if-no-files-found: error
      - name: Stop the run
        if: failure() && github.event_name != 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          node -e 'fetch(`${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/actions/workflows/stop-run.yml/dispatches`, { method: "POST", headers: { authorization: `Bearer ${process.env.GH_TOKEN}`, accept: "application/vnd.github+json" }, body: JSON.stringify({ ref: process.env.DEFAULT_BRANCH, inputs: { run: process.env.GITHUB_RUN_ID } }) }).then((r) => console.log(`Asked Stop run to cancel run ${process.env.GITHUB_RUN_ID}: ${r.status}`))' \
            || echo "Couldn't ask to cancel run $GITHUB_RUN_ID: the stop job will."

  # The checks that need neither the build nor a browser, beside the build so they don't wait for it.
  static:
    name: types and lint
    needs: plan
    if: needs.plan.outputs.hold != '1' && (needs.plan.outputs.full == '1' || github.event_name == 'pull_request')
    runs-on: ${{ fromJSON(github.event_name == 'merge_group' && needs.plan.outputs.x86runner || (github.event.pull_request.head.repo.fork != true && vars.SERUPA_RUNNER) || '"ubuntu-24.04"') }}
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:9beb546099e11f52d62e505537914870e01a67e0e6b00ae41da4775324e73dbe
      options: --cpus 4
    timeout-minutes: 20
    steps:
      # A job stopped mid-fetch can leave a ref lock in the runner's reused workspace, and every later checkout there
      # fails on it ("cannot lock ref … .lock: File exists", ibm-burst-18, 13 Nov).
      - name: Clear stale git locks
        shell: bash
        run: find .git -name '*.lock' -type f -delete 2>/dev/null || true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          browsers: "false"
      - name: Dependencies are signed by the registry
        run: npm audit signatures
      - name: No dependency with a known high or critical advisory
        run: npm audit --audit-level=high
      - name: Every file carries the same version
        run: node tools/release.mjs --check
      - name: Type check
        run: npm run typecheck
      - name: Lint (ESLint and Stylelint)
        run: npm run lint

  # A pull request with a patch changeset that changes src/ must change a test that fails on the base's src/
  # (tools/fix-proof.mjs). A fix only the screenshots can show takes the "no-repro-test" label.
  fix-proof:
    name: fix proof
    needs: plan
    if: needs.plan.outputs.hold != '1' && github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'no-repro-test')
    runs-on: ${{ fromJSON(github.event_name == 'merge_group' && needs.plan.outputs.x86runner || (github.event.pull_request.head.repo.fork != true && vars.SERUPA_RUNNER) || '"ubuntu-24.04"') }}
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:9beb546099e11f52d62e505537914870e01a67e0e6b00ae41da4775324e73dbe
      options: --cpus 4
    timeout-minutes: 20
    steps:
      # A job stopped mid-fetch can leave a ref lock in the runner's reused workspace, and every later checkout there
      # fails on it ("cannot lock ref … .lock: File exists", ibm-burst-18, 13 Nov).
      - name: Clear stale git locks
        shell: bash
        run: find .git -name '*.lock' -type f -delete 2>/dev/null || true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # The base is the merge commit's first parent, the main this run tests on, as the plan job's: the event's base.sha
      # is main when the push came, and main can move before the job checks the merge out. Then the diff took in what
      # main gained since, and a tools-only pull request "changed src/ but no test" (#2009, #2012's Select.css, 15 Nov).
      - id: needed
        run: |
          git config --global --add safe.directory "$PWD"
          echo "base=$(git rev-parse HEAD^1)" >> "$GITHUB_OUTPUT"
          node tools/fix-proof.mjs "$(git rev-parse HEAD^1)" --needed | tee needed.txt
          grep -q '^needed=false' needed.txt && echo "needed=false" >> "$GITHUB_OUTPUT" || echo "needed=true" >> "$GITHUB_OUTPUT"
      - if: steps.needed.outputs.needed == 'true'
        uses: ./.github/actions/setup
      - if: steps.needed.outputs.needed == 'true'
        env:
          BASE_SHA: ${{ steps.needed.outputs.base }}
        run: node tools/fix-proof.mjs "$BASE_SHA"

  # The suite's groups as parallel jobs (tools/test/run.mjs --group, SERUPA_PART, SERUPA_SHARD). x86: the component tests,
  # whose timing budgets were measured on x64, and Visual, whose baselines are drawn with Chrome for Testing on x64 (a
# pull request's take GitHub's x64 runners, below).
  suite-x86:
    name: suite (${{ matrix.group }}${{ matrix.part && format(' {0}', matrix.part) || '' }} ${{ matrix.shard }})
    # Not after build: each job builds what it tests itself (about 25 s), where waiting for the build job took 100 s
    # (its container, checkout and setup, then the builds) off the front of every run (13 Nov). A held run (plan) skips
    # them, as it skips build.
    needs: [plan]
    if: needs.plan.outputs.hold != '1' && needs.plan.outputs.tests == '1' && needs.plan.outputs.x86any == '1'
    # The project's x86 runners take these for the queue, main and pull requests from this repository (a fork's run
    # stays on GitHub's runners): with one group in the queue most of the 30 sat idle while pull requests waited.
    # A pull request's shards take the x86 runners only while the merge queue is idle, and GitHub's runners
    # (SERUPA_RUNNER) otherwise (the plan job's prrunner), so the queue always has them. Visual draws main's pictures
    # and the branch's in the same job since ADR-0016, so any machine compares fairly, and the timing budgets leave room
    # for a slower machine. On 15 Nov ten pull requests, up to eight x86 jobs each, filled the 28 burst slots: queue jobs
    # waited about 40 minutes to start and nothing merged for an hour.
    # actions: write lets a failed job stop its own run (the last step).
    permissions:
      contents: read
      actions: write
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && needs.plan.outputs.prrunner || needs.plan.outputs.x86runner) }}
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:9beb546099e11f52d62e505537914870e01a67e0e6b00ae41da4775324e73dbe
      options: --cpus 4
    # A visual shard draws every picture twice (main's and the branch's): about 18 minutes on a burst runner, and 27 on
    # serupa-runner, the slower machine, where #2023's visual 1/5 ran out of the 30 minutes in its last seconds and had
    # to run again (16 Nov). The other groups take under 15 anywhere.
    timeout-minutes: ${{ matrix.group == 'visual' && 40 || 30 }}
    strategy:
      # On a pull request and in the queue the first failing job cancels the others; main runs every job to the end.
      fail-fast: ${{ github.event_name != 'push' }}
      # A pull request takes at most eight runners at once, so one doesn't hold all of GitHub's; a queue group 24 of the
      # 28 burst slots.
      # A pull request on the burst runners takes four slots here and three in the other suite job, seven of 28: on
      # 15 Nov two pull requests held eight in each, 18 slots, while three queue groups waited 20 minutes for them. From
      # 03:00 to 06:00 on 16 Nov the slots averaged 12.5 busy and were all full for 3 minutes, so the fourth costs the
      # queue little and takes a pull request's Visual from three waves to two.
      max-parallel: ${{ github.event_name == 'pull_request' && (contains(needs.plan.outputs.prrunner, 'self-hosted') && 4 || 8) || 24 }}
      matrix: ${{ fromJSON(needs.plan.outputs.x86) }}
    steps: &suite-steps
      # A fetch that stalls has no timeout of its own, and one held a queue group for the job's whole 30 minutes
      # (12 Nov): give it five, then fetch once more.
      # A job stopped mid-fetch can leave a ref lock in the runner's reused workspace, and every later checkout there
      # fails on it ("cannot lock ref … .lock: File exists", ibm-burst-18, 13 Nov).
      - name: Clear stale git locks
        shell: bash
        run: find .git -name '*.lock' -type f -delete 2>/dev/null || true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        timeout-minutes: 5
        continue-on-error: true
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: ${{ needs.plan.outputs.since && '0' || '1' }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.checkout.outcome == 'failure'
        timeout-minutes: 10
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: ${{ needs.plan.outputs.since && '0' || '1' }}
      # A job that passed on this same tree against the same base passes again without running.
      - id: key
        shell: bash
        env:
          JOB: ${{ matrix.group }}-${{ matrix.part }}-${{ matrix.shard }}
          SINCE: ${{ needs.plan.outputs.since }}
        run: |
          git config --global --add safe.directory "$PWD"
          echo "key=result-${JOB//\//of}-$(git rev-parse HEAD^{tree})-${SINCE:-full}" >> "$GITHUB_OUTPUT"
      # Not Visual on a pull request: its pictures are the review (visual-review), so it draws them every time.
      - id: done
        if: matrix.part != 'base' && !(matrix.group == 'visual' && github.event_name == 'pull_request')
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .result
          key: ${{ steps.key.outputs.key }}
          lookup-only: true
      - if: steps.done.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup
      # The same commands as the build job, which stays the required check that the build works: the component tests
      # need the package alone, every other group Storybook too.
      - name: Build
        if: steps.done.outputs.cache-hit != 'true'
        shell: bash
        env:
          GROUP: ${{ matrix.group }}
          EVENT: ${{ github.event_name }}
          SINCE: ${{ needs.plan.outputs.since }}
        run: |
          npm run build
          if [ "$GROUP" != components ]; then npm run build-storybook; fi
          # Visual on a pull request draws main's pictures too (ADR-0016): main's Storybook, built from the commit this
          # run merges into, in a worktree beside this one. Its own dependencies only when its lockfile differs.
          if [ "$GROUP" = visual ] && [ "$EVENT" = pull_request ] && [ -n "$SINCE" ]; then
            rm -rf ../main-tree && git worktree prune
            git worktree add --detach ../main-tree "$SINCE"
            if cmp -s package-lock.json ../main-tree/package-lock.json; then ln -s "$PWD/node_modules" ../main-tree/node_modules
            else (cd ../main-tree && npm ci --ignore-scripts --no-audit --no-fund); fi
            (cd ../main-tree && npm run build && npm run build-storybook)
            echo "SERUPA_VISUAL_BASE=$(cd ../main-tree && pwd)/storybook-static" >> "$GITHUB_ENV"
          fi
      - name: Test suite
        if: steps.done.outputs.cache-hit != 'true'
        shell: bash
        env:
          GROUP: ${{ matrix.group }}
          SERUPA_PART: ${{ matrix.part }}
          SERUPA_SHARD: ${{ matrix.shard }}
          # The component tests' base shards write the coverage blobs the coverage job merges.
          SERUPA_COVERAGE: ${{ matrix.part == 'base' && '1' || '' }}
          SINCE: ${{ needs.plan.outputs.since }}
        run: |
          set -o pipefail
          node tools/test/run.mjs --group "$GROUP" ${SINCE:+--since "$SINCE"} 2>&1 | tee test-output.txt
      - if: success() && steps.done.outputs.cache-hit != 'true' && matrix.part != 'base'
        run: mkdir -p .result && echo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > .result/run
      - if: success() && steps.done.outputs.cache-hit != 'true' && matrix.part != 'base'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .result
          key: ${{ steps.key.outputs.key }}
      # Tests that passed only on their second try in the queue (FLAKY from the component tests, "passed the second
      # time" from Visual and Storybook), for the test job's "Flaky tests" issue.
      - if: success() && github.event_name == 'merge_group' && steps.done.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p .flaky
          { grep -E '^FLAKY ' test-output.txt || true; grep -oE 'passed the second time: .*' test-output.txt | sed 's/^passed the second time: /FLAKY story /' || true; } > .flaky/lines.txt
      - if: success() && github.event_name == 'merge_group' && steps.done.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flaky-${{ github.job }}-${{ strategy.job-index }}
          path: .flaky/
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: ignore
      # What Visual found different from main, before and after, for the visual-review job.
      - if: success() && matrix.group == 'visual' && github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-review-${{ strategy.job-index }}
          path: .visual-review/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: ignore
      - if: matrix.part == 'base'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-blob-${{ strategy.job-index }}
          path: |
            .vitest/blob/
            .vitest/narrowed
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: ignore
      - name: Show failures on the pull request
        if: failure()
        shell: bash
        run: |
          # head stops reading once it has its lines, and under pipefail that broken pipe (141) failed this step too, before
          # it wrote the list: the pull request showed no failures (14 Nov).
          set +o pipefail
          msg=$( { sed -n '/━━ Summary ━━/,$p' test-output.txt | grep '^FAIL'; echo; grep -E '^(CHANGED|NEW|MISSING|NO EFFECT) ' test-output.txt | head -20; grep -E -A1 '^FAIL' test-output.txt | grep -v '^--$' | head -60; } | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Failing tests (${{ matrix.group }})::${msg}"
          { echo '## Failing tests (${{ matrix.group }})'; echo '```'; grep -E -A1 '^FAIL|^(PASS|FAIL)  [A-Z]' test-output.txt | grep -v '^--$' | head -150; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload failure details
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-output-${{ github.job }}-${{ strategy.job-index }}
          path: |
            test-output.txt
            .test-tmp/
            tools/test/baseline-visual/**/*.actual.png
          if-no-files-found: ignore
      # The run can't pass any more, so the rest of it only holds runners: in the queue, the groups behind it wait on them.
      # The stop job below does the same, but only once every job it needs has ended: a group that failed at 20:41 ran on
      # to 20:57 (15 Nov). The step runs last, after the failure details are uploaded. It asks the Stop run workflow to
      # cancel the run rather than cancelling it here: a run cancelled from inside the failing job cancelled that job too,
      # so the job that failed showed as cancelled beside the others (storybook on #2021, 16 Nov) and read as a victim.
      - name: Stop the run
        if: failure() && github.event_name != 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          node -e 'fetch(`${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/actions/workflows/stop-run.yml/dispatches`, { method: "POST", headers: { authorization: `Bearer ${process.env.GH_TOKEN}`, accept: "application/vnd.github+json" }, body: JSON.stringify({ ref: process.env.DEFAULT_BRANCH, inputs: { run: process.env.GITHUB_RUN_ID } }) }).then((r) => console.log(`Asked Stop run to cancel run ${process.env.GITHUB_RUN_ID}: ${r.status}`))' \
            || echo "Couldn't ask to cancel run $GITHUB_RUN_ID: the stop job will."

  # The checks and the Storybook checks (axe in every theme, text spacing, 200% text, reflow): no screenshot, no timing
  # budget, so any runner, Arm included.
  suite-portable:
    name: suite (${{ matrix.group }} ${{ matrix.shard }})
    needs: [plan]
    if: needs.plan.outputs.hold != '1' && needs.plan.outputs.tests == '1'
    # actions: write lets a failed job stop its own run (the last step).
    permissions:
      contents: read
      actions: write
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && needs.plan.outputs.prrunner || needs.plan.outputs.x86runner) }}
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:9beb546099e11f52d62e505537914870e01a67e0e6b00ae41da4775324e73dbe
      options: --cpus 4
    timeout-minutes: 30
    # The build job checked the size budgets already, so the checks group doesn't build and measure them again.
    env:
      SERUPA_SIZE_IN_BUILD: '1'
    strategy:
      fail-fast: ${{ github.event_name != 'push' }}
      # A pull request on the burst runners takes three slots here and three in the other suite job, six of 28: on
      # 15 Nov two pull requests held eight in each, 18 slots, while three queue groups waited 20 minutes for them.
      max-parallel: ${{ github.event_name == 'pull_request' && (contains(needs.plan.outputs.prrunner, 'self-hosted') && 3 || 8) || 24 }}
      matrix: ${{ fromJSON(needs.plan.outputs.portable) }}
    steps: *suite-steps

  # Coverage of the component tests (V8, floors in vitest.config.ts): the base shards' blobs merged into one. A narrowed
  # run checks only that every function it adds runs in a test; the floors are checked on whole runs. Not in the merge
  # queue: each pull request's own run already checked the functions it adds, a queue run is narrowed (no floors), and
  # this job sat after every suite shard, about 1.3 of a queue run's 9 minutes. The nightly run checks the floors.
  coverage:
    needs: [plan, build, suite-x86]
    if: needs.plan.outputs.tests == '1' && github.event_name != 'merge_group'
    runs-on: ${{ fromJSON(github.event_name == 'merge_group' && needs.plan.outputs.x86runner || (github.event.pull_request.head.repo.fork != true && vars.SERUPA_RUNNER) || '"ubuntu-24.04"') }}
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:9beb546099e11f52d62e505537914870e01a67e0e6b00ae41da4775324e73dbe
      options: --cpus 4
    timeout-minutes: 15
    steps:
      # A job stopped mid-fetch can leave a ref lock in the runner's reused workspace, and every later checkout there
      # fails on it ("cannot lock ref … .lock: File exists", ibm-burst-18, 13 Nov).
      - name: Clear stale git locks
        shell: bash
        run: find .git -name '*.lock' -type f -delete 2>/dev/null || true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: ${{ needs.plan.outputs.since && '0' || '1' }}
      - uses: ./.github/actions/setup
        with:
          browsers: "false"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-blob-*
          merge-multiple: true
          path: .vitest
      - shell: bash
        env:
          SINCE: ${{ needs.plan.outputs.since }}
        run: |
          set -e
          if ! ls .vitest/blob/* >/dev/null 2>&1; then echo "No component tests ran, so there is no coverage to check."; exit 0; fi
          if [ -f .vitest/narrowed ]; then echo "Narrowed run; the floors are checked on whole runs."; export SERUPA_NO_FLOORS=1; fi
          node node_modules/vitest/vitest.mjs --merge-reports .vitest/blob --coverage
          if [ -n "$SINCE" ]; then node tools/coverage-new-functions.mjs "$SINCE"; fi
      - if: always()
        run: node tools/test/vitest/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY" || true

  # The package installed into an empty project on the oldest Node package.json allows, and the one between.
  consumer:
    name: consumer (Node ${{ matrix.node }})
    needs: [plan, build]
    if: needs.plan.outputs.full == '1'
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    runs-on: ${{ fromJSON(github.event_name == 'merge_group' && needs.plan.outputs.x86runner || (github.event.pull_request.head.repo.fork != true && vars.SERUPA_RUNNER) || '"ubuntu-24.04"') }}
    container:
      image: node:${{ matrix.node }}
      options: --cpus 4
    timeout-minutes: 20
    steps:
      # A job stopped mid-fetch can leave a ref lock in the runner's reused workspace, and every later checkout there
      # fails on it ("cannot lock ref … .lock: File exists", ibm-burst-18, 13 Nov).
      - name: Clear stale git locks
        shell: bash
        run: find .git -name '*.lock' -type f -delete 2>/dev/null || true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
      - run: node tools/test/consumer.mjs

  # The packed build in a Next.js, a React Router and an Astro app, rendered on the server and hydrated in Chromium.
  frameworks:
    needs: [plan, build]
    if: needs.plan.outputs.full == '1'
    runs-on: ${{ fromJSON(github.event_name == 'merge_group' && needs.plan.outputs.x86runner || (github.event.pull_request.head.repo.fork != true && vars.SERUPA_RUNNER) || '"ubuntu-24.04"') }}
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:9beb546099e11f52d62e505537914870e01a67e0e6b00ae41da4775324e73dbe
      options: --cpus 4
    timeout-minutes: 20
    steps:
      # A job stopped mid-fetch can leave a ref lock in the runner's reused workspace, and every later checkout there
      # fails on it ("cannot lock ref … .lock: File exists", ibm-burst-18, 13 Nov).
      - name: Clear stale git locks
        shell: bash
        run: find .git -name '*.lock' -type f -delete 2>/dev/null || true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
      - run: node tools/test/frameworks.mjs

  # A pull request's pictures against main's (ADR-0016): the Visual jobs drew both, from this tree and from the commit
  # it merges into, so nothing committed has to be fresh. This lays what differs out in the summary, before and after
  # (the pictures on the branch visual-review/pr-<number>), and passes once the design-qa label was added after the
  # last commit that isn't a merge. Adding the label runs it again (design-qa.yml). Nothing different: it passes.
  visual-review:
    name: visual review
    needs: [plan, suite-x86]
    if: needs.plan.outputs.hold != '1' && github.event_name == 'pull_request' && needs.plan.outputs.visual == '1' && needs.suite-x86.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The script is main's: the branch's code runs only in the Visual jobs, which have no write token.
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: tools/visual-review.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: visual-review-*
          path: .visual-review
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          PUBLISH: ${{ github.event.pull_request.head.repo.full_name == github.repository && '1' || '0' }}
        run: |
          if [ ! -f tools/visual-review.mjs ]; then echo "Main has no visual review yet: nothing to check."; exit 0; fi
          node tools/visual-review.mjs .visual-review

  # On a pull request, the first failed job stops the whole run: it can't pass any more, so its runners go to the next.
  # A failed queue run is out of the queue already, so the rest of it (the cross-browser components above all, up to
  # 75 minutes on an x86 runner) only keeps runners from the groups behind it. Main's own run goes on to the end.
  stop:
    needs: [build, static, fix-proof, suite-x86, suite-portable, coverage]
    if: failure() && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: gh run cancel "$RUN_ID"

  # One check that passes only when every job this run needed passed: the required check, on pull requests and in the
  # merge queue alike.
  # A held run (plan) ends cancelled, not failed: the check shows grey while the pictures are drawn, where a red X read
  # as a real failure (#1818, 13 Nov). It still never passes, so the pull request can't merge on it; should the cancel
  # not land, the step fails as before. Update baselines starts a cancelled held run again just as a failed one.
  test:
    needs: [plan, build, static, fix-proof, suite-x86, suite-portable, coverage, consumer, frameworks, visual-review]
    # Like always(), except on a held run: GitHub weighs a running job's condition again when the run is cancelled and
    # stops it only when that comes out false. With always() the held job kept running past its own cancel and ended
    # failed, the red X it was meant to replace (#1890, 14 Nov).
    if: ${{ !cancelled() || needs.plan.outputs.hold != '1' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      issues: write
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
          HEAD_REF: ${{ github.head_ref }}
          HOLD: ${{ needs.plan.outputs.hold }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ "$HEAD_REF" = changeset-release/main ]; then echo "Release pull request: CI is started on it by the Release workflow."; exit 0; fi
          if [ "$HOLD" = 1 ]; then
            echo "Held while Update baselines draws the pictures: CI runs on its commit, or again here when nothing changed."
            gh run cancel "$RUN_ID" && sleep 120
            exit 1
          fi
          # Skipped is fine (a job this kind of run doesn't need); anything else but success fails.
          bad=$(echo "$RESULTS" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key): \(.value.result)"')
          if [ -n "$bad" ]; then echo "$bad"; exit 1; fi
          # build must have run, on every kind of run.
          echo "$RESULTS" | jq -e '.build.result == "success"' >/dev/null
      - if: ${{ !cancelled() && github.event_name == 'merge_group' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: flaky-*
          path: .flaky
      # A test that passed only on its second try in this queue run: noted in the one open "Flaky tests" issue (label
      # flaky), with the run, so a flake is fixed rather than retried for good. It never fails the run.
      - if: ${{ !cancelled() && github.event_name == 'merge_group' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          lines=$(cat .flaky/*/lines.txt 2>/dev/null | sort -u || true)
          [ -n "$lines" ] || { echo "No test needed a second try."; exit 0; }
          body=$(printf 'Passed only on the second try in %s:\n\n%s\n' "$RUN_URL" "$(sed 's/^FLAKY /- /' <<< "$lines")")
          n=$(gh api "repos/$GH_REPO/issues?state=open&labels=flaky&per_page=1" --jq '.[0].number // empty')
          if [ -n "$n" ]; then gh api "repos/$GH_REPO/issues/$n/comments" -f body="$body" >/dev/null
          else
            intro="Tests that failed once and passed on the retry in the merge queue (vitest.config.ts, retry). Each is a test to fix; the queue retries them only so one flake can't drop a group."
            gh api "repos/$GH_REPO/issues" -f title="Flaky tests" -f body="$(printf '%s\n\n%s' "$intro" "$body")" -f 'labels[]=flaky' >/dev/null
          fi
          echo "$lines"
