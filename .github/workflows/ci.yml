name: CI

# How a change is tested on its way to main:
# - A pull request's own run is the quick check: build, types and lint, the fix proof, the checks, and the tests (in
#   English), Visual and Storybook checks of the components it changes (narrowed against the main it merges onto). The
#   tests in the other languages, consumer and frameworks are left to the merge queue. Firefox and WebKit are tested
#   nightly (cross-browser.yml): a difference there doesn't block a merge, so the queue doesn't wait on it.
# - The merge queue runs every job on the commit that becomes main, for a group of up to five pull requests at once,
#   with the tests narrowed as a pull request's are, against the group before it (or main): what the group's own change
#   can affect, on the exact tree it makes. Main's push run is then build only (the Storybook artifact, and the Release
#   workflow waits on it). Every night the flake hunt tests main whole, unnarrowed, with the coverage floors (nightly.yml).
# - Without a merge queue (repository variable SERUPA_QUEUE not "1"), a pull request and main both run everything.
# - Every job runs in Playwright's Ubuntu 24.04 image, capped at 4 CPUs, on GitHub's runners or on the project's own
#   (repository variables SERUPA_RUNNER and SERUPA_X86_RUNNER, JSON: '["self-hosted","linux","x86"]'). Jobs with a
#   screenshot or a timing budget take SERUPA_X86_RUNNER: the baselines are drawn with Chrome for Testing on x64. A pull
#   request from a fork always runs on GitHub's runners, so code nobody has merged never runs on the project's machines.
#   The x86 jobs take SERUPA_X86_RUNNER for the merge queue, main and same-repository pull requests (up to eight at once).
# - Results are kept: a job that passed on the same tree, against the same base, passes again at once without running.
# - The nightly jobs are in nightly.yml. No workflow_dispatch: a run started by hand runs in the default branch's
#   cache scope on any ref, which CodeQL rightly counts as cache poisoning; the nightly runs main whole instead.

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

# A new push to a pull request cancels the run before it. Queue and main runs all finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Chrome for Testing at the version browsers.json names, which tools/setup.mjs installs and the setup action caches.
  # The image's own /ms-playwright holds a later patch of that revision, which tools/test/visual.mjs refuses.
  PLAYWRIGHT_BROWSERS_PATH: /github/home/.cache/ms-playwright

jobs:
  # What this run tests: whole or narrowed, and which suite jobs it needs.
  plan:
    if: github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      hold: ${{ steps.hold.outputs.hold }}
      wide: ${{ steps.plan.outputs.wide }}
      full: ${{ steps.plan.outputs.full }}
      since: ${{ steps.plan.outputs.since }}
      x86: ${{ steps.plan.outputs.x86 }}
      x86any: ${{ steps.plan.outputs.x86any }}
      portable: ${{ steps.plan.outputs.portable }}
      tests: ${{ steps.plan.outputs.tests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      # For tools/test/run.mjs --list (no npm ci: it needs Node alone).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Held: the pull request carries the update-visual-baselines label, so Update baselines is drawing its pictures
      # now and will push them (a new run) or, with nothing to change, start this run again once the label is off.
      # Testing this commit meanwhile would only be done twice. The bot's own picture commit is never held.
      - id: hold
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          subject=$(git log -1 --format=%s HEAD^2)
          labels=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/labels" --jq '.[].name')
          if [ "$subject" != "Update test baselines on the CI runner" ] && grep -qx update-visual-baselines <<< "$labels"; then
            echo "hold=1" >> "$GITHUB_OUTPUT"
            echo "Held: Update baselines is drawing this pull request's pictures; CI runs on its commit, or again here when nothing changed." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - id: plan
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          QUEUE: ${{ vars.SERUPA_QUEUE }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          # full: every job runs. wide: the suite runs unnarrowed. tests: the suite runs at all.
          # A queue group runs every job, with the suite narrowed against the group before it (or main): that is the
          # commit its own change lands on, so it tests what the change can affect on the exact tree that becomes main,
          # and five groups don't each run the whole suite again. Main's push run behind the queue is build only; the
          # nightly flake hunt tests main whole, with the coverage floors (nightly.yml).
          full=""; wide=""; since=""; tests=1
          case "$EVENT" in
            merge_group) full=1; since="$QUEUE_BASE" ;;
            push) if [ "$QUEUE" = 1 ]; then tests=""; else full=1; wide=1; fi ;;
            pull_request)
              if [ "$QUEUE" = 1 ]; then since="$(git rev-parse HEAD^1)"; else full=1; wide=1; fi ;;
          esac
          # Visual on a narrowed run only when the change touches what a story's picture is built from.
          visual=1
          if [ -n "$since" ] && [ "$EVENT" = pull_request ]; then
            if ! git diff --name-only "$since" HEAD | grep -qE '^(src/|docs/|\.storybook/|design-tokens/|tokens/|tokens\.(css|json)$|fonts/|package(-lock)?\.json$|tsconfig\.json$|tsup\.config\.mjs$|\.nvmrc$|README\.md$|CHANGELOG\.md$|\.changeset/[^/]+\.md$|\.github/workflows/ci\.yml$|\.github/actions/|bin/migrate/|tools/(build|tokens|utilities|typescript|icons|fonts)/|tools/setup\.mjs$|tools/test/(lib|run|visual|storybook)\.mjs$|tools/test/baseline-visual/)'; then visual=""; fi
          fi
          # The component tests in the other languages run in the merge queue only, on the commit that becomes main: a
          # pull request's own run tests its components in English (and Visual when the pictures can change), the
          # failures a pull request meets most, so they are found before the queue, where one failure drops every
          # group behind it.
          x86='{"include":[
            {"group":"components","part":"base","shard":"1/3"},{"group":"components","part":"base","shard":"2/3"},{"group":"components","part":"base","shard":"3/3"}'
          if [ "$EVENT" != pull_request ] || [ -z "$since" ]; then
            x86="$x86"',{"group":"components","part":"locale","shard":"1/3"},{"group":"components","part":"locale","shard":"2/3"},{"group":"components","part":"locale","shard":"3/3"}'
          fi
          [ -n "$visual" ] && x86="$x86"',{"group":"visual","shard":"1/4"},{"group":"visual","shard":"2/4"},{"group":"visual","shard":"3/4"},{"group":"visual","shard":"4/4"}'
          x86="$x86]}"
          # A narrowed run that leaves a group nothing to test (a change to docs, tools or workflows alone) doesn't
          # start its jobs: each would take a runner, set up and run no test.
          # Storybook's checks (WCAG in every theme, reflow at 320px, the docs pages) on a pull request too, narrowed to the
          # stories it changes like Visual: found only in the queue, one story's failure took whole groups down with it.
          storybook="$full"; [ -n "$visual" ] && storybook=1
          if [ -n "$since" ]; then
            [ "$EVENT" = merge_group ] && git fetch -q --depth=1 origin "$since"
            has() { node tools/test/run.mjs --since "$since" --group "$1" --list | grep -q $'\t'; }
            if ! has components; then x86=$(echo "$x86" | jq -c '.include |= map(select(.group != "components"))'); fi
            if ! has visual; then x86=$(echo "$x86" | jq -c '.include |= map(select(.group != "visual"))'); fi
            if ! has storybook; then storybook=""; fi
          fi
          x86any=$(echo "$x86" | jq -r 'if (.include | length) > 0 then 1 else "" end')
          portable='{"include":[{"group":"checks","shard":"1/2"},{"group":"checks","shard":"2/2"}'
          [ -n "$storybook" ] && portable="$portable"',{"group":"storybook","shard":"1/3"},{"group":"storybook","shard":"2/3"},{"group":"storybook","shard":"3/3"}'
          portable="$portable]}"
          {
            echo "full=$full"; echo "wide=$wide"; echo "since=$since"; echo "tests=$tests"
            echo "x86=$(echo "$x86" | tr -d ' \n')"; echo "x86any=$x86any"; echo "portable=$(echo "$portable" | tr -d ' \n')"
          } >> "$GITHUB_OUTPUT"
          echo "full=${full:-no} wide=${wide:-no} since=${since:-none} visual=${visual:-no} tests=${tests:-no}"

  # Builds the package and Storybook once; every test job downloads them instead of building its own.
  # Fails in seconds when the branch's pictures can't match the tree it merges into: one side changed a component's
  # pictures and the other changed that component, or the pictures of one that uses it (tools/fresh.mjs). Without it the queue finds out on
  # Visual after 15 minutes and builds every group behind it again. In the queue it compares the newest pull request
  # with the group before it.
  fresh:
    if: (github.event_name == 'pull_request' || github.event_name == 'merge_group') && github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
          QUEUE_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          if [ "$EVENT" = merge_group ]; then
            # gh-readonly-queue/main/pr-<number>-<sha>: the pull request this group adds.
            n=$(echo "$QUEUE_REF" | sed -E 's|.*/pr-([0-9]+)-.*|\1|')
            node tools/fresh.mjs --base "$QUEUE_BASE" --head "$(gh api "repos/$GH_REPO/pulls/$n" --jq .head.sha)"
          else
            # The main this run tests against: the first parent of the merge commit GitHub made for it.
            node tools/fresh.mjs --base "$(gh api "repos/$GH_REPO/commits/$GITHUB_SHA" --jq '.parents[0].sha')" --head "$PR_HEAD"
          fi

  build:
    needs: plan
    if: needs.plan.outputs.hold != '1'
    runs-on: ${{ fromJSON((github.event.pull_request.head.repo.fork != true && vars.SERUPA_RUNNER) || '"ubuntu-24.04"') }}
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --cpus 4
    timeout-minutes: 20
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: sha
        run: git config --global --add safe.directory "$PWD" && echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup
        with:
          browsers: "false"
      - name: tokens.css is generated from tokens.json
        run: node tools/tokens/build.mjs --check
      - name: Build the package
        run: npm run build
      - name: Build Storybook
        run: npm run build-storybook
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build
          path: |
            dist/
            storybook-static/
          retention-days: 3
          if-no-files-found: error

  # The checks that need neither the build nor a browser, beside the build so they don't wait for it.
  static:
    name: types and lint
    needs: plan
    if: needs.plan.outputs.hold != '1' && (needs.plan.outputs.full == '1' || github.event_name == 'pull_request')
    runs-on: ${{ fromJSON((github.event.pull_request.head.repo.fork != true && vars.SERUPA_RUNNER) || '"ubuntu-24.04"') }}
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --cpus 4
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          browsers: "false"
      - name: Dependencies are signed by the registry
        run: npm audit signatures
      - name: No dependency with a known high or critical advisory
        run: npm audit --audit-level=high
      - name: Every file carries the same version
        run: node tools/release.mjs --check
      - name: Type check
        run: npm run typecheck
      - name: Lint (ESLint and Stylelint)
        run: npm run lint

  # A pull request with a patch changeset that changes src/ must change a test that fails on the base's src/
  # (tools/fix-proof.mjs). A fix only the screenshots can show takes the "no-repro-test" label.
  fix-proof:
    name: fix proof
    needs: plan
    if: needs.plan.outputs.hold != '1' && github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'no-repro-test')
    runs-on: ${{ fromJSON((github.event.pull_request.head.repo.fork != true && vars.SERUPA_RUNNER) || '"ubuntu-24.04"') }}
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --cpus 4
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: needed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git config --global --add safe.directory "$PWD"
          node tools/fix-proof.mjs "$BASE_SHA" --needed | tee needed.txt
          grep -q '^needed=false' needed.txt && echo "needed=false" >> "$GITHUB_OUTPUT" || echo "needed=true" >> "$GITHUB_OUTPUT"
      - if: steps.needed.outputs.needed == 'true'
        uses: ./.github/actions/setup
      - if: steps.needed.outputs.needed == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node tools/fix-proof.mjs "$BASE_SHA"

  # The suite's groups as parallel jobs (tools/test/run.mjs --group, SERUPA_PART, SERUPA_SHARD). x86: the component tests,
  # whose timing budgets were measured on x64, and Visual, whose baselines are drawn with Chrome for Testing on x64.
  suite-x86:
    name: suite (${{ matrix.group }}${{ matrix.part && format(' {0}', matrix.part) || '' }} ${{ matrix.shard }})
    needs: [plan, build]
    if: needs.plan.outputs.tests == '1' && needs.plan.outputs.x86any == '1'
    # The project's x86 runners take these for the queue, main and pull requests from this repository (a fork's run
    # stays on GitHub's runners): with one group in the queue most of the 30 sat idle while pull requests waited.
    runs-on: ${{ fromJSON((github.event.pull_request.head.repo.fork != true && vars.SERUPA_X86_RUNNER) || '"ubuntu-24.04"') }}
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --cpus 4
    timeout-minutes: 30
    strategy:
      # On a pull request the first failing job cancels the others; the queue and main run every job to the end.
      fail-fast: ${{ github.event_name == 'pull_request' }}
      # A pull request takes at most eight x86 runners at once, a queue group sixteen, so pull requests can't fill the
      # 30 and starve the queue. The queue's other jobs stay on GitHub's runners: with every queue job on the x86
      # runners (12 Nov), five groups left 27 jobs waiting for them while GitHub's runners stood idle.
      max-parallel: ${{ github.event_name == 'pull_request' && 8 || 16 }}
      matrix: ${{ fromJSON(needs.plan.outputs.x86) }}
    steps: &suite-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.build.outputs.sha }}
          fetch-depth: ${{ needs.plan.outputs.since && '0' || '1' }}
      # A job that passed on this same tree against the same base passes again without running.
      - id: key
        shell: bash
        env:
          JOB: ${{ matrix.group }}-${{ matrix.part }}-${{ matrix.shard }}
          SINCE: ${{ needs.plan.outputs.since }}
        run: |
          git config --global --add safe.directory "$PWD"
          echo "key=result-${JOB//\//of}-$(git rev-parse HEAD^{tree})-${SINCE:-full}" >> "$GITHUB_OUTPUT"
      - id: done
        if: matrix.part != 'base'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .result
          key: ${{ steps.key.outputs.key }}
          lookup-only: true
      - if: steps.done.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup
      - if: steps.done.outputs.cache-hit != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
      - name: Test suite
        if: steps.done.outputs.cache-hit != 'true'
        shell: bash
        env:
          GROUP: ${{ matrix.group }}
          SERUPA_PART: ${{ matrix.part }}
          SERUPA_SHARD: ${{ matrix.shard }}
          # The component tests' base shards write the coverage blobs the coverage job merges.
          SERUPA_COVERAGE: ${{ matrix.part == 'base' && '1' || '' }}
          SINCE: ${{ needs.plan.outputs.since }}
        run: |
          set -o pipefail
          node tools/test/run.mjs --group "$GROUP" ${SINCE:+--since "$SINCE"} 2>&1 | tee test-output.txt
      - if: success() && steps.done.outputs.cache-hit != 'true' && matrix.part != 'base'
        run: mkdir -p .result && echo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > .result/run
      - if: success() && steps.done.outputs.cache-hit != 'true' && matrix.part != 'base'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .result
          key: ${{ steps.key.outputs.key }}
      - if: matrix.part == 'base'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-blob-${{ strategy.job-index }}
          path: |
            .vitest/blob/
            .vitest/narrowed
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: ignore
      - name: Show failures on the pull request
        if: failure()
        shell: bash
        run: |
          msg=$( { sed -n '/━━ Summary ━━/,$p' test-output.txt | grep '^FAIL'; echo; grep -E '^(CHANGED|NEW|MISSING|NO EFFECT) ' test-output.txt | head -20; grep -E -A1 '^FAIL' test-output.txt | grep -v '^--$' | head -60; } | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Failing tests (${{ matrix.group }})::${msg}"
          { echo '## Failing tests (${{ matrix.group }})'; echo '```'; grep -E -A1 '^FAIL|^(PASS|FAIL)  [A-Z]' test-output.txt | grep -v '^--$' | head -150; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload failure details
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-output-${{ github.job }}-${{ strategy.job-index }}
          path: |
            test-output.txt
            .test-tmp/
            tools/test/baseline-visual/**/*.actual.png
          if-no-files-found: ignore

  # The checks and the Storybook checks (axe in every theme, text spacing, 200% text, reflow): no screenshot, no timing
  # budget, so any runner, Arm included.
  suite-portable:
    name: suite (${{ matrix.group }} ${{ matrix.shard }})
    needs: [plan, build]
    if: needs.plan.outputs.tests == '1'
    runs-on: ${{ fromJSON((github.event.pull_request.head.repo.fork != true && vars.SERUPA_RUNNER) || '"ubuntu-24.04"') }}
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --cpus 4
    timeout-minutes: 30
    strategy:
      fail-fast: ${{ github.event_name == 'pull_request' }}
      matrix: ${{ fromJSON(needs.plan.outputs.portable) }}
    steps: *suite-steps

  # Coverage of the component tests (V8, floors in vitest.config.ts): the base shards' blobs merged into one. A narrowed
  # run checks only that every function it adds runs in a test; the floors are checked on whole runs.
  coverage:
    needs: [plan, build, suite-x86]
    if: needs.plan.outputs.tests == '1'
    runs-on: ${{ fromJSON((github.event.pull_request.head.repo.fork != true && vars.SERUPA_RUNNER) || '"ubuntu-24.04"') }}
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --cpus 4
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.build.outputs.sha }}
          fetch-depth: ${{ needs.plan.outputs.since && '0' || '1' }}
      - uses: ./.github/actions/setup
        with:
          browsers: "false"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-blob-*
          merge-multiple: true
          path: .vitest
      - shell: bash
        env:
          SINCE: ${{ needs.plan.outputs.since }}
        run: |
          set -e
          if ! ls .vitest/blob/* >/dev/null 2>&1; then echo "No component tests ran, so there is no coverage to check."; exit 0; fi
          if [ -f .vitest/narrowed ]; then echo "Narrowed run; the floors are checked on whole runs."; export SERUPA_NO_FLOORS=1; fi
          node node_modules/vitest/vitest.mjs --merge-reports .vitest/blob --coverage
          if [ -n "$SINCE" ]; then node tools/coverage-new-functions.mjs "$SINCE"; fi
      - if: always()
        run: node tools/test/vitest/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY" || true

  # The package installed into an empty project on the oldest Node package.json allows, and the one between.
  consumer:
    name: consumer (Node ${{ matrix.node }})
    needs: [plan, build]
    if: needs.plan.outputs.full == '1'
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    runs-on: ${{ fromJSON((github.event.pull_request.head.repo.fork != true && vars.SERUPA_RUNNER) || '"ubuntu-24.04"') }}
    container:
      image: node:${{ matrix.node }}
      options: --cpus 4
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.build.outputs.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
      - run: node tools/test/consumer.mjs

  # The packed build in a Next.js, a React Router and an Astro app, rendered on the server and hydrated in Chromium.
  frameworks:
    needs: [plan, build]
    if: needs.plan.outputs.full == '1'
    runs-on: ${{ fromJSON((github.event.pull_request.head.repo.fork != true && vars.SERUPA_RUNNER) || '"ubuntu-24.04"') }}
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --cpus 4
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.build.outputs.sha }}
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
      - run: node tools/test/frameworks.mjs

  # On a pull request, the first failed job stops the whole run: it can't pass any more, so its runners go to the next.
  # A failed queue run is out of the queue already, so the rest of it (the cross-browser components above all, up to
  # 75 minutes on an x86 runner) only keeps runners from the groups behind it. Main's own run goes on to the end.
  stop:
    needs: [fresh, build, static, fix-proof, suite-x86, suite-portable, coverage]
    if: failure() && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: gh run cancel "$RUN_ID"

  # One check that passes only when every job this run needed passed: the required check, on pull requests and in the
  # merge queue alike.
  test:
    needs: [plan, fresh, build, static, fix-proof, suite-x86, suite-portable, coverage, consumer, frameworks]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
          HEAD_REF: ${{ github.head_ref }}
          HOLD: ${{ needs.plan.outputs.hold }}
        run: |
          if [ "$HEAD_REF" = changeset-release/main ]; then echo "Release pull request: CI is started on it by the Release workflow."; exit 0; fi
          if [ "$HOLD" = 1 ]; then echo "Held while Update baselines draws the pictures: CI runs on its commit, or again here when nothing changed."; exit 1; fi
          # Skipped is fine (a job this kind of run doesn't need); anything else but success fails.
          bad=$(echo "$RESULTS" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key): \(.value.result)"')
          if [ -n "$bad" ]; then echo "$bad"; exit 1; fi
          # build must have run, on every kind of run.
          echo "$RESULTS" | jq -e '.build.result == "success"' >/dev/null
