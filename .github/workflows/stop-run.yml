name: Stop run

# CI's fail-fast (ci.yml, the "Stop the run" steps): a job that failed asks this workflow to cancel its run, so the
# rest of the run stops holding runners. The cancel comes from here, a few seconds later, and not from the failing job
# itself, once that job has ended as failed, so it keeps its failure: cancelled from inside, or before its post
# steps were done, it showed as cancelled like the jobs it stopped (#2021 and #1977, 16 Nov). Only pull request
# and merge queue runs of CI are cancelled, never main's.
on:
  workflow_dispatch:
    inputs:
      run:
        description: The CI run to cancel (its id)
        required: true

permissions: {}

jobs:
  stop:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ inputs.run }}
        run: |
          set -euo pipefail
          if [[ ! "$RUN" =~ ^[0-9]+$ ]]; then echo "Not a run id: $RUN"; exit 1; fi
          read -r name event status < <(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN" --jq '"\(.name) \(.event) \(.status)"')
          if [ "$name" != CI ] || { [ "$event" != pull_request ] && [ "$event" != merge_group ]; }; then
            echo "Run $RUN is $name on $event: only CI's pull request and merge queue runs are stopped."; exit 0
          fi
          if [ "$status" = completed ]; then echo "Run $RUN has already ended."; exit 0; fi
          # Wait for the job that asked to end as failed first: its post steps (stopping its container) took 9 s on
          # #1977 (16 Nov), and a cancel that lands before them marks it cancelled like the rest. Up to 2 minutes.
          for _ in $(seq 24); do
            failed=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN/jobs?filter=latest&per_page=100" --jq '[.jobs[] | select(.conclusion == "failure")] | length')
            [ "$failed" -gt 0 ] && break
            sleep 5
          done
          echo "Failed jobs in run $RUN: $failed."
          gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$RUN/cancel" >/dev/null && echo "Cancelled run $RUN."
