name: Cross-browser

# Every night, the component tests, the checks and the Storybook checks run in Firefox and WebKit (Safari's engine) as well as Chromium,
# and the component tests in the oldest Chrome the package supports.
# It doesn't block pull requests: a red run here is a browser difference to look at, not a broken main.
# It also runs on demand from the Actions tab.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

# Read the code; nothing here writes to the repository. The report job also writes one issue.
# A newer run of this workflow on the same branch cancels the one before it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  components:
    name: ${{ matrix.group }} (${{ matrix.browser }})
    strategy:
      fail-fast: false
      matrix:
        # Visual against tools/test/baseline-visual-<browser>/ (visual.mjs), drawn in this same image.
        group: [components, checks, storybook, visual]
        browser: [firefox, webkit]
    runs-on: ${{ fromJSON(vars.SERUPA_X86_RUNNER || '"ubuntu-24.04"') }}
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --cpus 4
    env:
      # Firefox and WebKit from the image's own browsers.
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      # Firefox won't start with a HOME the container's root doesn't own (GitHub's /github/home), as Playwright's
      # docs say for containers on GitHub Actions.
      HOME: /root
    timeout-minutes: 75
    steps:
      # A job stopped mid-fetch can leave a ref lock in the runner's reused workspace, and every later checkout there
      # fails on it ("cannot lock ref … .lock: File exists", ibm-burst-18, 13 Nov).
      - name: Clear stale git locks
        shell: bash
        run: find .git -name '*.lock' -type f -delete 2>/dev/null || true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          browsers: "false"
      - run: apt-get install -y -qq --no-install-recommends fonts-liberation >/dev/null 2>&1 || (apt-get update -qq && apt-get install -y -qq --no-install-recommends fonts-liberation >/dev/null)
      - name: Build the package
        run: npm run build
      - name: Build Storybook
        if: matrix.group == 'storybook' || matrix.group == 'visual'
        run: npm run build-storybook
      - name: ${{ matrix.group }} in ${{ matrix.browser }}
        shell: bash
        run: |
          set -o pipefail
          node tools/test/run.mjs --browser ${{ matrix.browser }} --group ${{ matrix.group }} 2>&1 | tee test-output.txt
      - name: List the failures
        if: failure()
        shell: bash
        run: |
          { echo '## Failing: ${{ matrix.group }} in ${{ matrix.browser }}'; echo '```'; grep -E -A1 '^\s*FAIL' test-output.txt | grep -v '^--$' | head -150; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-output-${{ matrix.group }}-${{ matrix.browser }}
          path: test-output.txt
          if-no-files-found: ignore
  # The component tests in the oldest Chrome the package supports (package.json's browserslist, through
  # tools/browser-floor.mjs), on main and on the next major's branch, whose floor is higher. Firefox and WebKit at
  # their floor can't be driven by this Playwright; browser-baseline.mjs holds the CSS and script to it instead.
  floor:
    name: components (Chrome floor, ${{ matrix.ref }})
    strategy:
      fail-fast: false
      matrix:
        ref: [main, next]
    runs-on: ${{ fromJSON(vars.SERUPA_X86_RUNNER || '"ubuntu-24.04"') }}
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --cpus 4
    env:
      HOME: /root
    timeout-minutes: 75
    steps:
      - name: Clear stale git locks
        shell: bash
        run: find .git -name '*.lock' -type f -delete 2>/dev/null || true
      # next exists only between a major's first pull request and its release.
      - name: Is there a ${{ matrix.ref }} branch?
        id: ref
        shell: bash
        env:
          REF: ${{ matrix.ref }}
          REPO: ${{ github.server_url }}/${{ github.repository }}
        run: |
          if git ls-remote --exit-code --heads "$REPO" "$REF" >/dev/null; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "No $REF branch: nothing to test."; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.ref.outputs.run == 'true'
        with:
          persist-credentials: false
          ref: ${{ matrix.ref }}
      - uses: ./.github/actions/setup
        if: steps.ref.outputs.run == 'true'
      - if: steps.ref.outputs.run == 'true'
        run: apt-get install -y -qq --no-install-recommends fonts-liberation unzip >/dev/null 2>&1 || (apt-get update -qq && apt-get install -y -qq --no-install-recommends fonts-liberation unzip >/dev/null)
      - if: steps.ref.outputs.run == 'true'
        name: Build the package
        run: npm run build
      - if: steps.ref.outputs.run == 'true'
        name: Components in Chrome at the floor
        shell: bash
        run: |
          set -o pipefail
          node tools/browser-floor.mjs
          SERUPA_CHROMIUM="$(node tools/browser-floor.mjs --chromium)" node tools/test/run.mjs --group components 2>&1 | tee test-output.txt
      - name: List the failures
        if: failure()
        shell: bash
        env:
          REF: ${{ matrix.ref }}
        run: |
          { echo "## Failing: components in Chrome at the floor ($REF)"; echo '```'; grep -E -A1 '^\s*FAIL' test-output.txt | grep -v '^--$' | head -150; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the output
        if: always() && steps.ref.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-output-floor-${{ matrix.ref }}-chromium
          path: test-output.txt
          if-no-files-found: ignore
  # A scheduled run opens one issue when it fails (or updates the open one) and closes it when it's green again.
  report:
    name: nightly issue
    needs: [components, floor]
    if: always() && github.event_name == 'schedule' && needs.components.result != 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true   # a run that stopped before any upload still gets its issue
        with:
          pattern: test-output-*
          path: artifacts
      - name: Open, update or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.floor.result == 'failure' && 'failure' || needs.components.result }}
          JOBS: floor-main-chromium,components-firefox,components-webkit,checks-firefox,checks-webkit,storybook-firefox,storybook-webkit,visual-firefox,visual-webkit
        run: node tools/nightly-issue.mjs artifacts "$RESULT"
