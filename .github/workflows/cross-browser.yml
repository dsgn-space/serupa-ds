name: Cross-browser

# Every night, the component tests, the checks and the Storybook checks run in Firefox and WebKit (Safari's engine) as well as Chromium,
# and the component tests in the oldest Chrome the package supports.
# It doesn't block pull requests: a red run here is a browser difference to look at, not a broken main.
# It also runs on demand from the Actions tab.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

# Read the code; nothing here writes to the repository. The report job also writes one issue.
# A newer run of this workflow on the same branch cancels the one before it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Where the x86 jobs go: the project's machines while a self-hosted runner has started a job in the last 100 minutes,
  # GitHub's runners otherwise. The burst VM deletes itself after two idle hours, and a job sent to it then waits a day
  # and is cancelled (Nightly and Cross-browser, 18 to 20 Nov). tools/runner-watch.mjs --pick.
  runner:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      x86: ${{ steps.pick.outputs.x86 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: tools/runner-watch.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          X86: ${{ vars.SERUPA_X86_RUNNER }}
          FORK: ${{ github.event.pull_request.head.repo.fork == true }}
        run: |
          if ! runner=$(node tools/runner-watch.mjs --pick 100); then
            if [ "$FORK" = true ]; then runner='"ubuntu-24.04"'; else runner="${X86:-\"ubuntu-24.04\"}"; fi
            echo "::warning title=Runner check::GitHub didn't answer, so the x86 jobs go to $runner as set."
          fi
          echo "x86=$(echo "$runner" | tr -d ' \n')" >> "$GITHUB_OUTPUT"
          echo "x86 jobs run on: $runner" | tee -a "$GITHUB_STEP_SUMMARY"

  components:
    needs: runner
    name: ${{ matrix.group }}${{ matrix.part && format(' {0}', matrix.part) || '' }} (${{ matrix.browser }})
    strategy:
      fail-fast: false
      matrix:
        # Visual against tools/test/baseline-visual-<browser>/ (visual.mjs), drawn in this same image.
        group: [checks, storybook, visual]
        browser: [firefox, webkit]
        # The component tests run twice, in English and in a second language, which in Firefox took 50 minutes and then
        # some: the job hit its 75 minutes in the second language every night from 14 Nov, and was cancelled with no
        # report. So each language is a job of its own (SERUPA_PART, run.mjs).
        include:
          - { group: components, part: base, browser: firefox }
          - { group: components, part: locale, browser: firefox }
          - { group: components, part: base, browser: webkit }
          - { group: components, part: locale, browser: webkit }
    runs-on: ${{ fromJSON(needs.runner.outputs.x86) }}
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:9beb546099e11f52d62e505537914870e01a67e0e6b00ae41da4775324e73dbe
      options: --cpus 4
    env:
      # Firefox and WebKit from the image's own browsers.
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      # Firefox won't start with a HOME the container's root doesn't own (GitHub's /github/home), as Playwright's
      # docs say for containers on GitHub Actions.
      HOME: /root
    timeout-minutes: 75
    steps:
      # A job stopped mid-fetch can leave a ref lock in the runner's reused workspace, and every later checkout there
      # fails on it ("cannot lock ref … .lock: File exists", ibm-burst-18, 13 Nov).
      - name: Clear stale git locks
        shell: bash
        run: find .git -name '*.lock' -type f -delete 2>/dev/null || true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          browsers: "false"
      - run: apt-get install -y -qq --no-install-recommends fonts-liberation >/dev/null 2>&1 || (apt-get update -qq && apt-get install -y -qq --no-install-recommends fonts-liberation >/dev/null)
      - name: Build the package
        run: npm run build
      - name: Build Storybook
        if: matrix.group == 'storybook' || matrix.group == 'visual'
        run: npm run build-storybook
      - name: ${{ matrix.group }} in ${{ matrix.browser }}
        shell: bash
        run: |
          set -o pipefail
          SERUPA_PART=${{ matrix.part }} node tools/test/run.mjs --browser ${{ matrix.browser }} --group ${{ matrix.group }} 2>&1 | tee test-output.txt
      - name: List the failures
        if: failure()
        shell: bash
        run: |
          # head stops reading once it has its lines, and under pipefail that broken pipe (141) failed this step too, before
          # it wrote the list: the pull request showed no failures (14 Nov).
          set +o pipefail
          { echo '## Failing: ${{ matrix.group }} ${{ matrix.part }} in ${{ matrix.browser }}'; echo '```'; grep -E -A1 '^\s*FAIL' test-output.txt | grep -v '^--$' | head -150; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-output-${{ matrix.group }}${{ matrix.part && format('-{0}', matrix.part) || '' }}-${{ matrix.browser }}
          path: test-output.txt
          if-no-files-found: ignore
  # The component tests in the oldest Chrome the package supports (package.json's browserslist, through
  # tools/browser-floor.mjs). Nightly on main; on next (whose floor is higher) run this workflow from the Actions tab
  # with next as the branch. It never checks out another ref than the run's own: the setup action's cache is shared
  # with the default branch, and a checkout of another ref there is cache poisoning (CodeQL).
  # Firefox and WebKit at their floor can't be driven by this Playwright; browser-baseline.mjs holds the CSS and
  # script to it instead.
  floor:
    needs: runner
    name: components (Chrome floor)
    runs-on: ${{ fromJSON(needs.runner.outputs.x86) }}
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:9beb546099e11f52d62e505537914870e01a67e0e6b00ae41da4775324e73dbe
      options: --cpus 4
    env:
      HOME: /root
      # Chrome 123's headless shell takes its language from the container's C locale ("en-US@posix", which Intl
      # refuses), where Playwright's own Chromium says en-US.
      SERUPA_LOCALE: en-US
    timeout-minutes: 75
    steps:
      - name: Clear stale git locks
        shell: bash
        run: find .git -name '*.lock' -type f -delete 2>/dev/null || true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: apt-get install -y -qq --no-install-recommends fonts-liberation unzip >/dev/null 2>&1 || (apt-get update -qq && apt-get install -y -qq --no-install-recommends fonts-liberation unzip >/dev/null)
      - name: Build the package
        run: npm run build
      - name: Components in Chrome at the floor
        shell: bash
        run: |
          set -o pipefail
          node tools/browser-floor.mjs
          SERUPA_CHROMIUM="$(node tools/browser-floor.mjs --chromium)" node tools/test/run.mjs --group components 2>&1 | tee test-output.txt
      - name: List the failures
        if: failure()
        shell: bash
        run: |
          # head stops reading once it has its lines, and under pipefail that broken pipe (141) failed this step too, before
          # it wrote the list: the pull request showed no failures (14 Nov).
          set +o pipefail
          { echo "## Failing: components in Chrome at the floor"; echo '```'; grep -E -A1 '^\s*FAIL' test-output.txt | grep -v '^--$' | head -150; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-output-floor-chromium
          path: test-output.txt
          if-no-files-found: ignore
  # A scheduled run opens one issue when it fails (or updates the open one) and closes it when it's green again.
  report:
    name: nightly issue
    needs: [components, floor]
    if: always() && github.event_name == 'schedule' && needs.components.result != 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true   # a run that stopped before any upload still gets its issue
        with:
          pattern: test-output-*
          path: artifacts
      - name: Open, update or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.floor.result == 'failure' && 'failure' || needs.components.result }}
          JOBS: floor-chromium,components-base-firefox,components-locale-firefox,components-base-webkit,components-locale-webkit,checks-firefox,checks-webkit,storybook-firefox,storybook-webkit,visual-firefox,visual-webkit
        run: node tools/nightly-issue.mjs artifacts "$RESULT"
