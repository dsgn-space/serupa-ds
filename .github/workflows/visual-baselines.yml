name: Update baselines

# The utility classes' baseline (tools/test/baseline-utilities.json) holds text measurements, which differ slightly
# between machines (font smoothing, and the system fonts behind serif and mono), so it is made on the same runner CI
# uses. Add the "update-visual-baselines" label to a pull request to measure it again on its branch; the new baseline
# is committed back to the branch. Review it in the pull request's Files changed tab before merging.
# No picture is committed (ADR-0016): Visual draws main's pictures and the branch's on every run, so there are none to
# redraw here.
#
# The branch's code (its build, its dependencies) runs only in "render", which has a read-only token and no secrets: a
# dependency the pull request bumps finds nothing there that can write. "commit" runs none of the branch's code. It
# takes only tools/test/baseline-utilities.json from render, checks it, and pushes it with BOT_TOKEN (so the push
# starts CI), passed to that one git call.
#
# A pull request with a conflict gets no pull_request runs, so a label does nothing there. Run this workflow by hand
# (Actions > Update baselines > Run workflow, or `gh workflow run visual-baselines.yml -f pr=<number>`) to heal it:
# "heal" merges the base branch in, takes the base's side of baseline-utilities.json, and pushes the merge, which CI
# tests at once. A conflict in anything else stops it, since only a person can resolve that. Heal runs none of the
# branch's code: a run by hand belongs to the default branch, so the branch's code there could write to main's caches.
# Every push to main heals on its own the pull requests it left with a conflict ("dirty") in that file alone, when
# their auto-merge is on (or the queue dropped them) and they aren't labelled "hold-visual". One with a conflict
# anywhere else is left for its author, with a notice in the run.
# Every push to main also measures the utilities again on main as it now is, and opens a pull request (branch
# baselines/after-main, queued to merge; one at a time, replaced while it is open) when the baseline came out
# different: one measured before another pull request changed a shared style, and merged after it.
on:
  push:
    branches: [main]
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pr:
        description: The pull request's number
        required: true
        type: number

# A newer run for the same pull request cancels the one before it. Any other label gets a group of its own, so adding
# it while the baseline is being measured doesn't cancel it. Heal has its own group: the run its label starts must not
# cancel it. After main moves again, the newer heal replaces the older one. A push to main never cancels the
# measuring already running: the newest push waits behind it instead, and replaces any older push still waiting, so
# each run finishes once rather than being started and thrown away.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name == 'push' && 'heal-after-main' ||
    github.event_name == 'workflow_dispatch' && format('heal-{0}', inputs.pr) ||
    github.event.label.name == 'update-visual-baselines' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions: {}

jobs:
  # After a push to main: the open pull requests from this repository that now conflict with it. GitHub works out
  # whether one merges in the background, so a pull request it hasn't decided yet is asked again for up to a minute.
  # dropped.sh is main's own, and reads the branch only through GitHub's API: none of the branch's code runs here.
  dirty:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      prs: ${{ steps.find.outputs.prs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          prs=()
          for n in $(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&base=main&per_page=100" \
              --jq ".[] | select(.head.repo.full_name == \"$GITHUB_REPOSITORY\" and .draft == false) | .number"); do
            for _ in 1 2 3 4 5 6; do
              pull=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$n")
              state=$(jq -r .mergeable_state <<< "$pull")
              [ "$state" = unknown ] || break
              sleep 10
            done
            # Only one on its way to the queue: auto-merge on, or dropped by the queue with nothing since
            # (.github/dropped.sh). "hold-visual", or auto-merge turned off by a person, waits for a person: healing
            # one would spend runners nobody asked for (#1948, 15 Nov). A queued one reads auto-merge
            # off too: a push would take it out of the queue anyway.
            jq -e '[.labels[].name] | index("hold-visual")' <<< "$pull" > /dev/null && continue
            if jq -e '.auto_merge == null' <<< "$pull" > /dev/null; then [ "$(bash .github/dropped.sh "$n")" != - ] || continue; fi
            if [ "$state" = dirty ]; then prs+=("$n"); continue; fi
          done
          json=$(printf '%s\n' "${prs[@]}" | jq -R 'select(length > 0) | tonumber' | jq -cs '.[:5]')
          echo "Conflicting or stale: $json"
          echo "prs=$json" >> "$GITHUB_OUTPUT"

  heal:
    needs: dirty
    if: >-
      always() && (github.event_name == 'workflow_dispatch' ||
      (needs.dirty.result == 'success' && needs.dirty.outputs.prs != '[]'))
    name: heal (#${{ matrix.pr }})
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('[{0}]', inputs.pr) || needs.dirty.outputs.prs) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Find the pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ matrix.pr }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          [[ "$NUMBER" =~ ^[0-9]+$ ]] || fail "$NUMBER is not a pull request number"
          pull=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$NUMBER")
          [ "$(jq -r .state <<< "$pull")" = open ] || fail "#$NUMBER isn't open"
          [ "$(jq -r .head.repo.full_name <<< "$pull")" = "$GITHUB_REPOSITORY" ] || fail "#$NUMBER comes from a fork, so its branch can't take the push"
          {
            echo "head-ref=$(jq -r .head.ref <<< "$pull")"
            echo "head-sha=$(jq -r .head.sha <<< "$pull")"
            echo "base-ref=$(jq -r .base.ref <<< "$pull")"
          } | tee -a "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pr.outputs.head-sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Merge the base branch in
        id: merge
        env:
          BASE_REF: ${{ steps.pr.outputs.base-ref }}
          # By hand, a conflict outside the baseline fails the run; after a push to main it only leaves a notice.
          LEVEL: ${{ github.event_name == 'workflow_dispatch' && 'error' || 'notice' }}
          NUMBER: ${{ matrix.pr }}
        run: |
          set -euo pipefail
          base=$(git rev-parse "origin/$BASE_REF")
          # Someone merged the base in themselves after the push to main found the conflict: nothing to push, and no
          # label, which would hold the branch's CI for a redraw nobody asked for (#1796, 13 Nov).
          if git merge-base --is-ancestor "$base" HEAD; then
            echo "::notice::#$NUMBER already has $BASE_REF: nothing to heal."
            echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0
          fi
          id=(-c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com")
          if git "${id[@]}" merge --quiet --no-edit -m "Merge $BASE_REF into the branch (Update baselines)" "$base"; then exit 0; fi
          baseline='^tools/test/baseline-utilities\.json$'
          others=$(git diff --name-only --diff-filter=U | grep -Ev "$baseline" || true)
          if [ -n "$others" ]; then
            echo "::$LEVEL::#$NUMBER: these conflict and aren't the utilities baseline, so resolve them by hand: $(tr '\n' ' ' <<< "$others")"
            git merge --abort
            [ "$LEVEL" = notice ] && { echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0; }
            exit 1
          fi
          # The list is read whole first: git diff, still writing it, holds the index lock that each checkout below
          # needs ("index.lock: File exists" failed every heal of #1604 and #1674 on 12 Nov).
          git diff --name-only --diff-filter=U -z > "$RUNNER_TEMP/conflicted"
          while IFS= read -r -d '' f; do
            if git cat-file -e "$base:$f" 2> /dev/null; then git checkout --quiet "$base" -- "$f"; else git rm --quiet -- "$f"; fi
          done < "$RUNNER_TEMP/conflicted"
          git "${id[@]}" commit --quiet --no-edit
      # BOT_TOKEN, so the push starts CI. The push is refused if the branch moved on since the checkout.
      - name: Push the merge
        if: steps.merge.outputs.skip != '1'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          HEAD_REF: ${{ steps.pr.outputs.head-ref }}
          NUMBER: ${{ matrix.pr }}
        run: |
          set -euo pipefail
          # A queued branch can't take the push (GH006): take it out first, labelled "queue-stale" so it still counts as
          # on its way (.github/dropped.sh) and Queue enqueue puts it back once its CI is green.
          q=$(GH_TOKEN=$BOT_TOKEN gh api graphql -F n="$NUMBER" -f owner="${GITHUB_REPOSITORY%/*}" -f name="${GITHUB_REPOSITORY#*/}" -f query='
            query($owner: String!, $name: String!, $n: Int!) { repository(owner: $owner, name: $name) { pullRequest(number: $n) { id mergeQueueEntry { id } } } }' \
            --jq '.data.repository.pullRequest | "\(.id) \(.mergeQueueEntry != null)"')
          if [ "${q#* }" = true ]; then
            echo "::notice::#$NUMBER is in the merge queue with a conflict: taking it out to heal it."
            GH_TOKEN=$BOT_TOKEN gh pr edit "$NUMBER" --repo "$GITHUB_REPOSITORY" --add-label queue-stale
            GH_TOKEN=$BOT_TOKEN gh api graphql -f id="${q% *}" -f query='mutation($id: ID!) { dequeuePullRequest(input: { id: $id }) { clientMutationId } }' >/dev/null
            for _ in $(seq 12); do
              [ "$(gh api "repos/$GITHUB_REPOSITORY/issues/$NUMBER/timeline?per_page=100" --jq '[.[] | select(.event | test("merge_queue$"))] | last | .event')" = removed_from_merge_queue ] && break
              sleep 5
            done
          fi
          auth=$(printf 'x-access-token:%s' "$BOT_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$HEAD_REF"

  # After a push to main, the measuring waits for the merge queue to settle: while a group is building, another push is
  # coming, and it cancelled the redraw before (314 runner-minutes of cancelled redraws on 12 Nov, 12 of 14 runs). The
  # push that empties the queue (or the first half an hour after the last run that measured) measures again
  # (.github/last-redraw.sh), so a skipped push loses nothing.
  # Where the x86 jobs go: the project's machines while a self-hosted runner has started a job in the last 100 minutes,
  # GitHub's runners otherwise. The burst VM deletes itself after two hours with nothing to do, and a job sent to it then waits a day
  # and is cancelled (Nightly and Cross-browser, 18 to 20 Nov). tools/runner-watch.mjs --pick.
  runner:
    if: github.event_name == 'push' || github.event.label.name == 'update-visual-baselines'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      x86: ${{ steps.pick.outputs.x86 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: tools/runner-watch.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          X86: ${{ vars.SERUPA_X86_RUNNER }}
          FORK: ${{ github.event.pull_request.head.repo.fork == true }}
        run: |
          if ! runner=$(node tools/runner-watch.mjs --pick 100); then
            if [ "$FORK" = true ]; then runner='"ubuntu-24.04"'; else runner='"ubuntu-24.04"'; fi
            echo "::warning title=Runner check::GitHub didn't answer, so the x86 jobs go to GitHub's runners rather than wait on machines that may be off."
          fi
          echo "x86=$(echo "$runner" | tr -d ' \n')" >> "$GITHUB_OUTPUT"
          echo "x86 jobs run on: $runner" | tee -a "$GITHUB_STEP_SUMMARY"

  settled:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      go: ${{ steps.queue.outputs.go }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github
          persist-credentials: false
      - id: queue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/heads/gh-readonly-queue/main" --jq length)
          # A queue that never empties still gets a run every half hour, counted from the last one that ran: a
          # baseline main left behind fails every queue group's checks until the bot's pull request merges.
          last=$(bash .github/last-redraw.sh | cut -d, -f2)
          age=$(( $(date +%s) - $(date -d "${last:-1970-01-01T00:00:00Z}" +%s) ))
          if [ "$n" = 0 ] || [ "$age" -gt 1800 ]; then echo go=1 >> "$GITHUB_OUTPUT"
          else echo "$n queue groups building, last redraw $((age / 60)) minutes ago: the push that empties the queue redraws."; fi

  # On a push to main, render measures the utilities again on main as it is now: a pull request measured before another
  # one changed a shared style (a token, a font) and merged after it leaves the baseline behind. Commit then opens a
  # pull request with what changed.
  render:
    needs: [settled, runner]
    # Not after merging the bot's own pull request: a measurement that isn't steady would open one after another.
    # After a push, only once the merge queue has nothing building or the last run is half an hour old (settled).
    if: >-
      !cancelled() && (
      github.event_name == 'push' && needs.settled.outputs.go == '1' && !contains(github.event.head_commit.message, '/baselines/after-main') ||
      github.event.label.name == 'update-visual-baselines' && github.event.pull_request.head.repo.full_name == github.repository)
    name: render (1/1)
    # The runner and image CI's checks use (ci.yml), so the measurements match what CI compares them with.
    runs-on: ${{ fromJSON(needs.runner.outputs.x86) }}
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
      options: --cpus 4
    env:
      PLAYWRIGHT_BROWSERS_PATH: /github/home/.cache/ms-playwright
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # A job stopped mid-fetch can leave a ref lock in the runner's reused workspace, and every later checkout there
      # fails on it ("cannot lock ref … .lock: File exists", ibm-burst-18, 13 Nov).
      - name: Clear stale git locks
        shell: bash
        run: find .git -name '*.lock' -type f -delete 2>/dev/null || true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      # The x86 runner keeps its workspace between jobs, and checkout's clean leaves a file another job staged with
      # git add (it counts as tracked). Start from HEAD's tree alone.
      - name: Drop what an earlier job left staged
        run: |
          git config --global --add safe.directory "$PWD"
          git reset -q
          git clean -ffdxq
      - uses: ./.github/actions/setup
      - name: Measure the utilities
        run: |
          npm run build
          node tools/test/utilities.mjs --update
      - name: Collect what changed
        run: |
          # The x86 runner keeps RUNNER_TEMP between jobs, so start empty.
          out="$RUNNER_TEMP/baselines"
          rm -rf "$out"
          mkdir -p "$out/files"
          # upload-artifact uploads nothing for a folder with no files, and commit's download then fails: every push to
          # main whose measurement matched went red this way (26 Nov). The marker makes an unchanged measurement an
          # artifact too; commit reads only files/.
          : > "$out/measured"
          git add -A -- tools/test/baseline-utilities.json
          git diff --cached --no-renames --name-only --diff-filter=d -z | xargs -0 -r cp --parents -t "$out/files" --
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: baselines-chromium-0
          path: ${{ runner.temp }}/baselines
          retention-days: 1

  commit:
    needs: render
    # !cancelled(): on a label event render's own need, settled, is skipped, and without a status function that skip
    # would skip this job too, so the label measured the baselines but never committed them (26 Nov, #2352 and #2354).
    if: "!cancelled() && needs.render.result == 'success'"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: baselines-chromium-0
          path: ${{ runner.temp }}/baselines
      # Render ran the branch's code, so nothing it handed over is trusted: only the utilities JSON, a regular file
      # under 2 MiB, written to its own path (not through a symlink the branch put there).
      - name: Check the files
        run: |
          set -euo pipefail
          in="$RUNNER_TEMP/baselines"
          mkdir -p "$in/files"   # an empty upload carries nothing
          fail() { echo "::error::$1"; exit 1; }
          [ -z "$(find "$in" -mindepth 1 ! -type f ! -type d)" ] || fail "render handed over something that isn't a regular file"
          (cd "$in/files" && find . -type f | sed 's#^\./##' | sort) > "$RUNNER_TEMP/changed.txt"
          while IFS= read -r f; do
            [ "$f" = tools/test/baseline-utilities.json ] || fail "$f is not the utilities baseline"
            jq empty "$in/files/$f" || fail "$f is not JSON"
            [ "$(stat -c %s "$in/files/$f")" -le 2097152 ] || fail "$f is over 2 MiB"
            case "$(realpath -m -- "$f")" in "$GITHUB_WORKSPACE/tools/test/"*) ;; *) fail "$f leads outside tools/test/";; esac
          done < "$RUNNER_TEMP/changed.txt"
          echo "$(wc -l < "$RUNNER_TEMP/changed.txt") changed"
      - name: Commit them to the branch
        run: |
          set -euo pipefail
          in="$RUNNER_TEMP/baselines"
          while IFS= read -r f; do mkdir -p -- "$(dirname -- "$f")"; cp -- "$in/files/$f" "$f"; done < "$RUNNER_TEMP/changed.txt"
          [ -s "$RUNNER_TEMP/changed.txt" ] && git add --pathspec-from-file="$RUNNER_TEMP/changed.txt"
          if git diff --cached --quiet; then echo "Baselines unchanged."; exit 0; fi
          # After a push to main, the baseline goes to one pull request of the bot's own (baselines/after-main), queued
          # to merge: each run replaces its commit, so there is never more than one, and nothing stale means no pull
          # request.
          msg="Update test baselines on the CI runner"
          if [ "$GITHUB_EVENT_NAME" = push ]; then HEAD_REF=baselines/after-main; force=--force; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -m "$msg"
          # The token goes to this one push only. On a pull request the push is refused if the branch moved on since render.
          auth=$(printf 'x-access-token:%s' "$BOT_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push ${force:-} origin "HEAD:refs/heads/$HEAD_REF"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            git diff --stat HEAD^ HEAD | tail -1
            url=$(GH_TOKEN=$BOT_TOKEN gh pr list --repo "$GITHUB_REPOSITORY" --head "$HEAD_REF" --state open --json url --jq '.[0].url // empty')
            [ -n "$url" ] || url=$(GH_TOKEN=$BOT_TOKEN gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$HEAD_REF" --label no-changeset \
              --title "Measure the utilities main left behind" \
              --body "The utility classes measured on main as it is differ from tools/test/baseline-utilities.json: a pull request measured before another one changed a shared style merged with the old measurements. Update baselines replaces this branch's commit after each push to main while it is open.")
            GH_TOKEN=$BOT_TOKEN gh pr merge --repo "$GITHUB_REPOSITORY" --auto --merge "$url"
            echo "$url"
          fi
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}

  unlabel:
    needs: [render, commit]
    if: always() && github.event.label.name == 'update-visual-baselines' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      pull-requests: write
      actions: write
    steps:
      - name: Remove the label
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          LABEL: ${{ github.event.label.name }}
        run: gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label "$LABEL"
      # CI holds a pull request's run while this label is on (ci.yml, plan). When no new commit came of it (nothing to
      # change, or the drawing failed), start the held run of the branch's newest commit again: the label is off now,
      # so it tests. A pushed commit started its own run.
      - name: Start the held CI run again
        env:
          GH_TOKEN: ${{ github.token }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          LABEL: ${{ github.event.label.name }}
          DRAWN: ${{ github.event.pull_request.head.sha }}
          COMMIT: ${{ needs.commit.result }}
        run: |
          set -euo pipefail
          head=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)
          # Someone pushed while the baseline was measured, so the bot's push was refused: measure it again on the new
          # head (the label, added with BOT_TOKEN, starts this workflow again) instead of losing the work.
          if [ "$COMMIT" = failure ] && [ "$head" != "$DRAWN" ]; then
            echo "The branch moved while its baseline was measured: measuring it again on $head."
            GH_TOKEN=$BOT_TOKEN gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label "$LABEL"
            exit 0
          fi
          # The held run may still be stopping (its plan job cancels it) when this starts: wait for it to finish, or
          # the loop below finds no completed run and the pull request sits with a cancelled CI (#1928, 15 Nov: 50
          # minutes armed and out of the queue).
          for _ in $(seq 1 20); do
            busy=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=pull_request&head_sha=$head" --jq '[.workflow_runs[] | select(.status != "completed")] | length')
            [ "$busy" = 0 ] && break
            sleep 10
          done
          for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=pull_request&head_sha=$head&status=completed" --jq '.workflow_runs[].id'); do
            held=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs" --jq '[.jobs[] | select(.name == "build" and .conclusion == "skipped")] | length')
            [ "$held" = 0 ] && continue
            echo "Starting held run $id again."
            gh run rerun "$id" --repo "$GITHUB_REPOSITORY"
            break
          done
