name: Update baselines

# Screenshots and text measurements differ slightly between machines (font smoothing, and the
# system fonts behind serif and mono), so the visual and utility baselines are made on the same
# runner CI uses. Add the "update-visual-baselines" label to a pull request to re-render them on
# its branch; the new baselines are committed back to the branch. Review them in
# the pull request's Files changed tab before merging.
# Only the components the pull request changes (and the ones that use them) are re-rendered, as in CI, and a
# picture is rewritten only when it differs past the check's tolerance, so the commit holds only real changes and
# two pull requests that change different components don't conflict over each other's pictures.
#
# The "update-cross-browser-baselines" label does the same for Firefox's and WebKit's pictures
# (tools/test/baseline-visual-firefox/ and -webkit/, which the nightly Cross-browser run compares with): every story is
# drawn again in each engine, in the image Cross-browser uses, since those pictures fall behind whenever a story's look
# changes and nothing else redraws them.
#
# The branch's code (its build, its dependencies, its Playwright action) runs only in "render", which has a read-only
# token and no secrets: a dependency the pull request bumps finds nothing there that can write. "commit" runs none of
# the branch's code. It takes only PNGs under tools/test/baseline-visual*/ and tools/test/baseline-utilities.json from
# render, checks each one, and pushes them with BOT_TOKEN (so the push starts CI), passed to that one git call.
on:
  pull_request:
    types: [labeled]

# A newer run of the same workflow on the same branch or pull request cancels the one before it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  render:
    if: github.event.label.name == 'update-visual-baselines' && github.event.pull_request.head.repo.full_name == github.repository
    # The runner and image CI's Visual jobs use (ci.yml), so the pictures match what CI compares them with.
    runs-on: ${{ fromJSON((github.event.pull_request.head.repo.fork != true && vars.SERUPA_X86_RUNNER) || '"ubuntu-24.04"') }}
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --cpus 4
    env:
      PLAYWRIGHT_BROWSERS_PATH: /github/home/.cache/ms-playwright
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          # The base branch's history too, to find where the pull request started (git merge-base).
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Render the baselines
        run: |
          base=$(git merge-base "origin/$BASE_REF" HEAD)
          npm run build
          npm run build-storybook
          node tools/test/run.mjs --group visual --update --since "$base"
          node tools/test/utilities.mjs --update
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
      - name: Collect what changed
        run: |
          out="$RUNNER_TEMP/baselines"
          mkdir -p "$out/files"
          git add -A -- tools/test/baseline-visual tools/test/baseline-utilities.json
          git diff --cached --no-renames --name-only --diff-filter=d -z | xargs -0 -r cp --parents -t "$out/files" --
          git diff --cached --no-renames --name-only --diff-filter=D > "$out/deleted.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: baselines
          path: ${{ runner.temp }}/baselines
          retention-days: 1

  render-cross:
    if: github.event.label.name == 'update-cross-browser-baselines' && github.event.pull_request.head.repo.full_name == github.repository
    name: render (${{ matrix.browser }})
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    # The runner, image, browsers and fonts of Cross-browser's visual jobs (cross-browser.yml).
    runs-on: ${{ fromJSON(vars.SERUPA_X86_RUNNER || '"ubuntu-24.04"') }}
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --cpus 4
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      HOME: /root
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      # As in render: start from HEAD's tree alone, not from what an earlier job on this runner left staged.
      - name: Drop what an earlier job left staged
        run: |
          git config --global --add safe.directory "$PWD"
          git reset -q
          git clean -ffdxq
      - uses: ./.github/actions/setup
        with:
          browsers: "false"
      - run: apt-get install -y -qq --no-install-recommends fonts-liberation >/dev/null 2>&1 || (apt-get update -qq && apt-get install -y -qq --no-install-recommends fonts-liberation >/dev/null)
      # Whole, not only what the pull request changes: these pictures drift with every change to a story's look.
      - name: Render the baselines
        run: |
          npm run build
          npm run build-storybook
          node tools/test/run.mjs --browser "$BROWSER" --group visual --update
        env:
          BROWSER: ${{ matrix.browser }}
      - name: Collect what changed
        run: |
          out="$RUNNER_TEMP/baselines"
          mkdir -p "$out/files"
          git config --global --add safe.directory "$PWD"
          git add -A -- "tools/test/baseline-visual-$BROWSER"
          git diff --cached --no-renames --name-only --diff-filter=d -z | xargs -0 -r cp --parents -t "$out/files" --
          git diff --cached --no-renames --name-only --diff-filter=D > "$out/deleted.txt"
        env:
          BROWSER: ${{ matrix.browser }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: baselines-${{ matrix.browser }}
          path: ${{ runner.temp }}/baselines
          retention-days: 1

  commit:
    needs: [render, render-cross]
    # One of the two renders ran (its label), and neither failed.
    if: always() && !failure() && !cancelled() && (needs.render.result == 'success' || needs.render-cross.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      # Each render's files land in one folder, and their lists of removed files are joined.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: baselines*
          path: ${{ runner.temp }}/parts
      - name: Join the renders
        run: |
          set -euo pipefail
          in="$RUNNER_TEMP/baselines"; mkdir -p "$in/files"; : > "$in/deleted.txt"
          for d in "$RUNNER_TEMP"/parts/*/; do
            if [ -d "$d/files" ]; then cp -a "$d/files/." "$in/files/"; fi
            if [ -f "$d/deleted.txt" ]; then cat "$d/deleted.txt" >> "$in/deleted.txt"; fi
          done
      # Render ran the branch's code, so nothing it handed over is trusted: only regular files, only a PNG under
      # tools/test/baseline-visual(-firefox|-webkit)/<folder>/ or the utilities JSON, 2 MiB each and 100 MiB in all, and each one
      # written to a path inside tools/test/ (not through a symlink the branch put there).
      - name: Check the files
        run: |
          set -euo pipefail
          in="$RUNNER_TEMP/baselines"
          mkdir -p "$in/files"; touch "$in/deleted.txt"   # an empty upload carries neither
          png='^tools/test/baseline-visual(-firefox|-webkit)?/[A-Za-z0-9][A-Za-z0-9._-]*/[A-Za-z0-9][A-Za-z0-9._-]*\.png$'
          fail() { echo "::error::$1"; exit 1; }
          inside() { case "$(realpath -m -- "$1")" in "$GITHUB_WORKSPACE/tools/test/"*) ;; *) fail "$1 leads outside tools/test/";; esac; }
          [ -z "$(find "$in" -mindepth 1 ! -type f ! -type d)" ] || fail "render handed over something that isn't a regular file"
          [ -z "$(find "$in" -mindepth 1 -maxdepth 1 ! -name files ! -name deleted.txt)" ] || fail "render handed over an unexpected file"
          (cd "$in/files" && find . -type f | sed 's#^\./##' | sort) > "$RUNNER_TEMP/changed.txt"
          n=0; total=0
          while IFS= read -r f; do
            if [[ "$f" =~ $png ]]; then
              [ "$(head -c 8 "$in/files/$f" | od -An -tx1 | tr -d ' \n')" = 89504e470d0a1a0a ] || fail "$f is not a PNG"
            elif [ "$f" = tools/test/baseline-utilities.json ]; then
              jq empty "$in/files/$f" || fail "$f is not JSON"
            else
              fail "$f is not a baseline"
            fi
            size=$(stat -c %s "$in/files/$f")
            [ "$size" -le 2097152 ] || fail "$f is over 2 MiB"
            total=$((total + size)); n=$((n + 1))
            inside "$f"
          done < "$RUNNER_TEMP/changed.txt"
          [ "$total" -le 104857600 ] || fail "the baselines are over 100 MiB in all"
          while IFS= read -r f; do
            [[ "$f" =~ $png ]] || fail "$f is not a baseline, so it isn't removed"
            git ls-files --error-unmatch -- "$f" > /dev/null || fail "$f isn't in the branch"
            inside "$f"
          done < "$in/deleted.txt"
          echo "$n changed, $(wc -l < "$in/deleted.txt") removed"
      - name: Commit them to the branch
        run: |
          set -euo pipefail
          in="$RUNNER_TEMP/baselines"
          while IFS= read -r f; do mkdir -p -- "$(dirname -- "$f")"; cp -- "$in/files/$f" "$f"; done < "$RUNNER_TEMP/changed.txt"
          [ -s "$RUNNER_TEMP/changed.txt" ] && git add --pathspec-from-file="$RUNNER_TEMP/changed.txt"
          [ -s "$in/deleted.txt" ] && git rm --quiet --pathspec-from-file="$in/deleted.txt"
          if git diff --cached --quiet; then echo "Baselines unchanged."; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -m "Update test baselines on the CI runner"
          # The token goes to this one push only. The push is refused if the branch moved on since render.
          auth=$(printf 'x-access-token:%s' "$BOT_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$HEAD_REF"
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}

  # One comment on the pull request with what the refresh changed (K9): each picture beside the old one, the size
  # changes, the other baselines counted. Runs the base branch's own tools/baseline-report.mjs, never the pull
  # request's code, and edits its earlier comment (found by the report's first line) instead of adding another.
  report:
    needs: commit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Post or update the comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          git fetch --quiet origin "refs/pull/$PR_NUMBER/head:refs/remotes/pr/head"
          node tools/baseline-report.mjs "origin/$BASE_REF" pr/head > "$RUNNER_TEMP/report.md"
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- serupa-baseline-report -->")) | .id' | tail -1)
          if [ -n "$id" ]; then gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@"$RUNNER_TEMP/report.md" > /dev/null
          else gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/report.md"; fi

  unlabel:
    needs: [render, render-cross, commit]
    if: always() && (github.event.label.name == 'update-visual-baselines' || github.event.label.name == 'update-cross-browser-baselines') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Remove the label
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          LABEL: ${{ github.event.label.name }}
        run: gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label "$LABEL"
