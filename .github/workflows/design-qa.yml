name: Design QA

# The design-qa label signs a pull request's pictures off (ADR-0016). CI's visual-review job lays out every picture that
# differs from main's, drawn from the commit the pull request merges into, and fails until the label was added after the
# pull request's last commit that isn't a merge. Adding the label runs that job again here, so the pull request goes
# green without a push: the failed jobs of its newest CI run (visual-review and test) start again. A run still going
# reads the label when it gets there. Whoever owns the pull request reviews and adds the label.
on:
  pull_request:
    types: [labeled]

permissions: {}

jobs:
  rerun:
    if: github.event.label.name == 'design-qa' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$HEAD_SHA&event=pull_request&per_page=1" \
            --jq '.workflow_runs[0] | select(.status == "completed") | .id')
          if [ -z "$run" ]; then echo "CI is still running on $HEAD_SHA: its visual review reads the label when it gets there."; exit 0; fi
          review=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs?per_page=100" --jq '.jobs[] | select(.name == "visual review") | .conclusion')
          if [ "$review" != failure ]; then echo "Run $run's visual review: ${review:-not run}. Nothing to run again."; exit 0; fi
          echo "Running the failed jobs of run $run again: visual review reads the label now."
          gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$run/rerun-failed-jobs" >/dev/null
