name: Runner watch

# Says so when the project's x86 machines look gone: every ten minutes it lists the jobs of this repository that have
# waited over ten minutes for a self-hosted runner, and keeps them in one issue ("Jobs waiting for a runner", label
# runner-watch), closed again once none waits. On 14 Nov the burst runner was off for an hour and a merge-queue run
# waited for it the whole time with nothing to say so. CI's plan job asks the same question before each run and sends
# its x86 jobs to GitHub's runners meanwhile. It runs tools/runner-watch.mjs from main and no code from any branch.
on:
  schedule:
    - cron: '*/10 * * * *'

concurrency:
  group: runner-watch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/runner-watch.mjs --report 10
