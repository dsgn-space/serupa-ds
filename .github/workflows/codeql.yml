# CodeQL: GitHub's code scanning, for the TypeScript and tool scripts and for the workflows themselves.
# Findings show under Security → Code scanning and on pull requests. A pull request is scanned when it changes what a
# language reads: scripts other than stories for javascript-typescript, the workflows and actions for actions. Main is
# scanned whole every day (new queries arrive between commits, and it holds every merged change); the merge queue's
# groups aren't scanned again. A job with nothing to scan still passes, so the required `analyze` checks are met: on
# 12 and 13 Nov a tenth of all runner time went to scanning docs, pictures and stories, and every queue group again.
name: CodeQL

on:
  pull_request:
  merge_group:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
      # What to scan: everything on a schedule or by hand; on a pull request, only a language whose files it changes
      # (the first parent of GitHub's merge commit is the base); in the queue, nothing.
      - id: scan
        env:
          EVENT: ${{ github.event_name }}
          LANGUAGE: ${{ matrix.language }}
        run: |
          case "$EVENT" in
            schedule|workflow_dispatch) scan=1 ;;
            merge_group) scan="" ;;
            *)
              if [ "$LANGUAGE" = actions ]; then pattern='^\.github/(workflows|actions)/'
              else pattern='\.(m|c)?[jt]sx?$'; fi
              scan=$(git diff --name-only HEAD^1 HEAD | grep -E "$pattern" | grep -vE '\.stories\.[jt]sx?$|^(dist|storybook-static|tools/skill-eval/results)/|^src/material/icons\.ts$' | head -1 || true)
              [ -n "$scan" ] && scan=1 ;;
          esac
          echo "scan=$scan" >> "$GITHUB_OUTPUT"
          echo "${scan:+Scanning}${scan:-Nothing for $LANGUAGE to scan in this $EVENT run}"
      - if: steps.scan.outputs.scan == '1'
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          # Build output, generated files and the vendored React bundles aren't ours to scan.
          config: |
            paths-ignore:
              - dist
              - storybook-static
              - src/material/icons.ts
              # The apps coding agents wrote in the skill evaluations: kept as results, never run or shipped. About a
              # fifth of the repository's JavaScript and TypeScript (380 files, 30,000 lines), analysed on every run.
              - tools/skill-eval/results
      - if: steps.scan.outputs.scan == '1'
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
