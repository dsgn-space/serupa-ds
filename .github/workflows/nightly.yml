name: Nightly

# Every night on main (02:00 Jakarta): the whole suite twice more (a flake
# hunt), mutation testing, the benchmarks and the bundle size trend, and the SBOM. Cross-browser, Canary and Screen
# readers have their own workflows. A red run here is something to look at, not a broken main.
on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:

# A newer run of this workflow on the same branch cancels the one before it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PLAYWRIGHT_BROWSERS_PATH: /github/home/.cache/ms-playwright

jobs:
  flake-hunt:
    name: flake hunt (${{ matrix.group }})
    strategy:
      fail-fast: false
      matrix:
        group: [components, checks]
    runs-on: ${{ fromJSON(vars.SERUPA_X86_RUNNER || '"ubuntu-24.04"') }}
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --cpus 4
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - shell: bash
        env:
          GROUP: ${{ matrix.group }}
        run: |
          npm run build && npm run build-storybook
          set -o pipefail
          for i in 1 2; do node tools/test/run.mjs --group "$GROUP" 2>&1 | tee -a test-output.txt; done
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flake-hunt-${{ matrix.group }}
          path: test-output.txt
          retention-days: 7

  mutation:
    name: mutation (${{ matrix.shard }}/6)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    runs-on: ${{ fromJSON(vars.SERUPA_X86_RUNNER || '"ubuntu-24.04"') }}
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --cpus 4
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - env:
          SERUPA_SHARD: ${{ matrix.shard }}/6
        run: node tools/test/mutation.mjs --rotate --minutes 100 --json mutation.json
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-${{ matrix.shard }}
          path: mutation.json
          retention-days: 30
          if-no-files-found: ignore

  # Mount time and interaction latency, twice, against the last night's numbers (kept in the cache).
  benchmarks:
    runs-on: ${{ fromJSON(vars.SERUPA_X86_RUNNER || '"ubuntu-24.04"') }}
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --cpus 4
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .bench-history
          key: bench-history-${{ github.run_id }}
          restore-keys: bench-history-
      - shell: bash
        run: |
          for i in 1 2; do SERUPA_BENCH=.bench npx vitest run --project components --no-file-parallelism src/internal/mountTime.test.tsx src/internal/inp.test.tsx; done
          if [ -f .bench-history/last.json ]; then PREVIOUS="--previous .bench-history/last.json"; fi
          node tools/test/bench.mjs .bench --json bench.json $PREVIOUS
          mkdir -p .bench-history && cp bench.json .bench-history/last.json
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .bench-history
          key: bench-history-${{ github.run_id }}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench
          path: bench.json
          retention-days: 30
          if-no-files-found: ignore

  size-trend:
    name: size trend
    runs-on: ${{ fromJSON(vars.SERUPA_RUNNER || '"ubuntu-24.04"') }}
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --cpus 4
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          browsers: "false"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .size-history
          key: size-history-${{ github.run_id }}
          restore-keys: size-history-
      - shell: bash
        run: |
          npm run build
          if [ -f .size-history/last.json ]; then PREVIOUS="--previous .size-history/last.json"; fi
          node tools/test/size.mjs --json size.json $PREVIOUS
          mkdir -p .size-history && cp size.json .size-history/last.json
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .size-history
          key: size-history-${{ github.run_id }}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: size
          path: size.json
          retention-days: 30
          if-no-files-found: ignore

  sbom:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          browsers: "false"
      - run: npm sbom --sbom-format cyclonedx --omit dev > sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 90
