name: Nightly

# Every night on main (02:00 Jakarta): the whole suite twice more (a flake
# hunt; the queue tests each group narrowed, so this is main's whole run, with the coverage floors on the first pass), mutation testing, the benchmarks and the bundle size trend, the SBOM, and the health page's numbers from all of them (tools/health.mjs). Cross-browser, Canary and Screen
# readers have their own workflows. A red run here is something to look at, not a broken main.
on:
  schedule:
    # GitHub starts a scheduled run hours late when it falls on the hour (cron '0 3' began near 11:00, during the
    # working day, 17 to 20 Nov). An odd minute in the quiet evening hours (UTC) keeps it clear of pull requests
    # even when it is late.
    - cron: '23 17 * * *'
  workflow_dispatch:

# A newer run of this workflow on the same branch cancels the one before it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PLAYWRIGHT_BROWSERS_PATH: /github/home/.cache/ms-playwright

jobs:
  # Where the x86 jobs go: the project's machines while a self-hosted runner has started a job in the last 100 minutes,
  # GitHub's runners otherwise. The burst VM deletes itself after a day with nothing to do, and a job sent to it then waits a day
  # and is cancelled (Nightly and Cross-browser, 18 to 20 Nov). tools/runner-watch.mjs --pick.
  runner:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      x86: ${{ steps.pick.outputs.x86 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: tools/runner-watch.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          X86: ${{ vars.SERUPA_X86_RUNNER }}
          FORK: ${{ github.event.pull_request.head.repo.fork == true }}
        run: |
          if ! runner=$(node tools/runner-watch.mjs --pick 100); then
            if [ "$FORK" = true ]; then runner='"ubuntu-24.04"'; else runner="${X86:-\"ubuntu-24.04\"}"; fi
            echo "::warning title=Runner check::GitHub didn't answer, so the x86 jobs go to $runner as set."
          fi
          echo "x86=$(echo "$runner" | tr -d ' \n')" >> "$GITHUB_OUTPUT"
          echo "x86 jobs run on: $runner" | tee -a "$GITHUB_STEP_SUMMARY"

  flake-hunt:
    needs: runner
    name: flake hunt (${{ matrix.group }})
    strategy:
      fail-fast: false
      matrix:
        group: [components, checks, visual, storybook]
    runs-on: ${{ fromJSON(needs.runner.outputs.x86) }}
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:9beb546099e11f52d62e505537914870e01a67e0e6b00ae41da4775324e73dbe
      options: --cpus 4
    # The visual group ran 90 minutes and was stopped on the rebuilt burst VM (20 Nov); components took 85.
    timeout-minutes: 120
    steps:
      # A job stopped mid-fetch can leave a ref lock in the runner's reused workspace, and every later checkout there
      # fails on it ("cannot lock ref … .lock: File exists", ibm-burst-18, 13 Nov).
      - name: Clear stale git locks
        shell: bash
        run: find .git -name '*.lock' -type f -delete 2>/dev/null || true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - shell: bash
        env:
          GROUP: ${{ matrix.group }}
        run: |
          npm run build && npm run build-storybook
          set -o pipefail
          # The first pass of the component tests measures coverage against the floors (vitest.config.ts).
          # The Storybook group's first pass also keeps each story's axe result, for the health job.
          if [ "$GROUP" = components ]; then SERUPA_COVERAGE=1 node tools/test/run.mjs --group "$GROUP" 2>&1 | tee -a test-output.txt
          elif [ "$GROUP" = storybook ]; then SERUPA_A11Y_JSON="$PWD/a11y.json" node tools/test/run.mjs --group "$GROUP" 2>&1 | tee -a test-output.txt
          else node tools/test/run.mjs --group "$GROUP" 2>&1 | tee -a test-output.txt; fi
          # Visual draws main twice in its one pass and fails on a story that comes out different (run.mjs).
          if [ "$GROUP" != visual ]; then node tools/test/run.mjs --group "$GROUP" 2>&1 | tee -a test-output.txt; fi
      # The coverage and axe results for the health job, whether or not the pass was green.
      - if: ${{ !cancelled() && matrix.group == 'components' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-summary
          path: coverage/coverage-summary.json
          retention-days: 7
          if-no-files-found: ignore
      - if: ${{ !cancelled() && matrix.group == 'storybook' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: a11y
          path: a11y.json
          retention-days: 7
          if-no-files-found: ignore
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flake-hunt-${{ matrix.group }}
          path: test-output.txt
          retention-days: 7

  mutation:
    needs: runner
    name: mutation (${{ matrix.shard }}/6)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    runs-on: ${{ fromJSON(needs.runner.outputs.x86) }}
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:9beb546099e11f52d62e505537914870e01a67e0e6b00ae41da4775324e73dbe
      options: --cpus 4
    timeout-minutes: 120
    steps:
      # A job stopped mid-fetch can leave a ref lock in the runner's reused workspace, and every later checkout there
      # fails on it ("cannot lock ref … .lock: File exists", ibm-burst-18, 13 Nov).
      - name: Clear stale git locks
        shell: bash
        run: find .git -name '*.lock' -type f -delete 2>/dev/null || true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - env:
          SERUPA_SHARD: ${{ matrix.shard }}/6
        # No new file after 75 minutes: one file can take 30 or more, and with 100 shards 3 and 4 ran into the job's
        # 120 minutes and were stopped with nothing reported (rebuilt burst VM, 20 Nov).
        run: node tools/test/mutation.mjs --rotate --minutes 75 --json mutation.json
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-${{ matrix.shard }}
          path: mutation.json
          retention-days: 30
          if-no-files-found: ignore

  # Mount time and interaction latency, twice, against the last night's numbers (kept in the cache).
  benchmarks:
    needs: runner
    runs-on: ${{ fromJSON(needs.runner.outputs.x86) }}
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:9beb546099e11f52d62e505537914870e01a67e0e6b00ae41da4775324e73dbe
      options: --cpus 4
    timeout-minutes: 45
    steps:
      # A job stopped mid-fetch can leave a ref lock in the runner's reused workspace, and every later checkout there
      # fails on it ("cannot lock ref … .lock: File exists", ibm-burst-18, 13 Nov).
      - name: Clear stale git locks
        shell: bash
        run: find .git -name '*.lock' -type f -delete 2>/dev/null || true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Times are compared only with times from the same kind of machine: the CPU model and its count. The rebuilt
      # burst VM ran identical code 1.2 times slower than the last night's machine, and up to 2.7 on three components,
      # which failed the job (20 Nov). A machine with no history of its own starts one.
      - id: machine
        shell: bash
        run: |
          echo "id=$(grep -m1 'model name' /proc/cpuinfo | sed 's/.*: //' | tr -c 'A-Za-z0-9' '-' | tr -s '-')$(nproc)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .bench-history
          key: bench-history-${{ steps.machine.outputs.id }}-${{ github.run_id }}
          restore-keys: bench-history-${{ steps.machine.outputs.id }}-
      - shell: bash
        run: |
          for i in 1 2; do SERUPA_BENCH=.bench npx vitest run --project components --no-file-parallelism src/internal/mountTime.test.tsx src/internal/inp.test.tsx; done
          if [ -f .bench-history/last.json ]; then PREVIOUS="--previous .bench-history/last.json"; fi
          # Tonight's times are tomorrow's "last night" whether or not tonight passed (see size-trend below).
          status=0
          node tools/test/bench.mjs .bench --json bench.json $PREVIOUS || status=$?
          if [ -f bench.json ]; then mkdir -p .bench-history && cp bench.json .bench-history/last.json; fi
          exit $status
      - if: ${{ !cancelled() && hashFiles('bench.json') != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .bench-history
          key: bench-history-${{ steps.machine.outputs.id }}-${{ github.run_id }}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench
          path: bench.json
          retention-days: 30
          if-no-files-found: ignore

  size-trend:
    name: size trend
    runs-on: ${{ fromJSON(vars.SERUPA_RUNNER || '"ubuntu-24.04"') }}
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:9beb546099e11f52d62e505537914870e01a67e0e6b00ae41da4775324e73dbe
      options: --cpus 4
    timeout-minutes: 20
    steps:
      # A job stopped mid-fetch can leave a ref lock in the runner's reused workspace, and every later checkout there
      # fails on it ("cannot lock ref … .lock: File exists", ibm-burst-18, 13 Nov).
      - name: Clear stale git locks
        shell: bash
        run: find .git -name '*.lock' -type f -delete 2>/dev/null || true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          browsers: "false"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .size-history
          key: size-history-${{ github.run_id }}
          restore-keys: size-history-
      - shell: bash
        run: |
          npm run build
          if [ -f .size-history/last.json ]; then PREVIOUS="--previous .size-history/last.json"; fi
          # Tonight's sizes are tomorrow's "last night" whether or not tonight passed. Kept only on a pass, one red
          # night left every later night comparing with the last green one: 14 Nov failed, so 15 Nov compared with
          # 13 Nov, two nights of growth counted as one, and it failed again, and so on every night after.
          status=0
          node tools/test/size.mjs --json size.json $PREVIOUS || status=$?
          if [ -f size.json ]; then mkdir -p .size-history && cp size.json .size-history/last.json; fi
          exit $status
      - if: ${{ !cancelled() && hashFiles('size.json') != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .size-history
          key: size-history-${{ github.run_id }}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: size
          path: size.json
          retention-days: 30
          if-no-files-found: ignore

  sbom:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:9beb546099e11f52d62e505537914870e01a67e0e6b00ae41da4775324e73dbe
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          browsers: "false"
      - run: npm sbom --sbom-format cyclonedx --omit dev > sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 90

  # The health page's numbers (docs/Health.mdx): the repository's, with tonight's coverage, axe results and sizes, and the
  # open issues. Written to this run's summary page and kept as the health artifact, which
  # node tools/health.mjs --from-nightly fetches. Runs whatever the jobs before it found, red or green.
  health:
    needs: [flake-hunt, size-trend]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # tools/health.mjs reads files and GitHub's API with Node's own modules: no npm ci.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '{coverage-summary,a11y,size}'
          path: results
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          arg() { if [ -f "results/$1/$2" ]; then echo "$3 results/$1/$2"; fi; }
          node tools/health.mjs --out health.json --issues --summary $(arg coverage-summary coverage-summary.json --coverage) $(arg a11y a11y.json --a11y) $(arg size size.json --size)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: health
          path: health.json
          retention-days: 30
