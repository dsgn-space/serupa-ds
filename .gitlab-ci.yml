# GitLab CI: the jobs of .github/workflows/ci.yml (and the Changeset workflow's check), for the GitLab interim.
# SERUPA_CI_MODE picks where a merge request's checks run:
# - runner (default): on the project's own runners (an x86 server and an Arm one; jobs tagged x86, the screenshots and
#   timing budgets, run only on x86, and every other job on whichever is free; see tools/README.md), with no minute limit.
#   A merge request runs the whole pipeline below: build, types and lint, the changeset check, the suite (what the
#   MR changes, tools/test/run.mjs --since its base), consumer and frameworks. The runner keeps the cache and the
#   pulled images between jobs, so setup costs seconds.
# - local: the fallback for GitLab's shared runners and their 400 minutes a month. A merge request's pipeline is one
#   job, local checks (tools/local-checks-gate.mjs on a small Node image, about half a minute): its description must
#   hold a passing tools/ci.mjs report for the commit, which already ran everything below on the author's machine.
# Main runs everything after each merge (the newest merge cancels the run before it). A pipeline started by hand (Build > Pipelines > Run pipeline) runs everything.
# - Merge requests test what they change (tools/test/run.mjs --since the MR's base), as GitHub's pull requests did.
# - Every job runs in Playwright's Ubuntu 24.04 image (the fonts and system libraries Chromium needs, as GitHub's
#   ubuntu-24.04 runners had them), and tools/setup.mjs adds the Node major devEngines asks for and the Chromium
#   revision this Playwright pins. The image's own Node and browsers are only a starting point.
# - build makes dist/ and storybook-static/ once; the test jobs take them as artifacts.
# - The suite's groups run in parallel: checks, visual and storybook in three shards each (SERUPA_SHARD). Three, not more: GitLab counts
#   every job against the project's 500 in flight, and three keeps each shard within the component tests' 7 minutes.
# - Results are kept (.result-cache): a job that passed on the same tree, against the same base, passes again at
#   once without running. The same commit's next pipeline (a label, a description, auto-merge) costs seconds.
# - Nightly: the pipeline schedule on main (Build > Pipeline schedules, 02:00 Jakarta) runs the whole suite
#   unnarrowed, mutation testing and the benchmarks (bottom of this file), and the cross-browser run.
# - In place of GitHub's CodeQL and dependency review: GitLab's secret detection and SAST, and npm audit (bottom).
# - Nightly also: canary (TypeScript next, React canary), a flake hunt (components and checks twice more) and the SBOM.
# - Not here: the screen-reader run (VoiceOver and NVDA need macOS and Windows) and Scorecard. Release stays
#   GitHub-only until the repo goes back (tools/tag-release.mjs tags versions meanwhile).

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"
    # The cross-browser run (below): a pipeline started through the API or by a schedule. These run to the end: a
    # merge to main doesn't cancel them (the first nightly, 9 Nov 2026, was cancelled five minutes in by one), and a
    # failed job doesn't stop the others, since every finding of a nightly run is worth having.
    - if: $CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == "schedule"
      auto_cancel:
        on_new_commit: none
        on_job_failure: none
    # Main after every merge, unnarrowed, as GitHub's CI did on push: a merge request is tested on its own branch, not
    # merged onto main (GitLab's merged-results pipelines aren't on the free tier), so two that pass alone and break
    # together show up here. A newer merge cancels the run before it, so the latest main is always the one tested.
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  # A new push cancels the pipeline for the push before it, and the first failed job cancels the rest of its
  # pipeline: a red run stops spending CI minutes as soon as it's red.
  auto_cancel:
    on_new_commit: interruptible
    on_job_failure: all

stages: [build, test]

variables:
  # Every merge request runs the whole suite (components, checks, Storybook, and Visual when it touches what a picture
  # is built from), not only what it changes: what a narrowed run leaves out is found before the merge, not after.
  # Set to "" to narrow again when there are fewer runners (the IBM burst runner gives 14 slots until its credit ends).
  SERUPA_WIDE: "1"
  # The cross-browser job's groups (below): checks, components, storybook, visual.
  SERUPA_CROSS_GROUPS: checks components storybook visual
  # The Chromium the baselines are drawn with: Chrome for Testing at the version browsers.json names, which
  # tools/setup.mjs installs. The image's own /ms-playwright holds a later patch of that revision (156.0.8078.80
  # for .4), which tools/test/visual.mjs refuses. Kept in the cache, so it downloads once.
  PLAYWRIGHT_BROWSERS_PATH: $CI_PROJECT_DIR/.ci-home/ms-playwright
  npm_config_cache: $CI_PROJECT_DIR/.npm
  # Merge requests need the history back to their base for --since and the changeset check.
  GIT_DEPTH: "0"
  # runner or local, see the top of this file. Switch back to local if the runner is gone for a while.
  SERUPA_CI_MODE: runner

default:
  # The Playwright version in package-lock.json, for the system libraries and fonts its Chromium needs (and Node 26).
  # Bump it with Playwright.
  image: mcr.microsoft.com/playwright:v1.64.1-noble
  interruptible: true
  # Once more when the machine, not the code, failed: a runner restart, a lost connection, GitLab's API. A failing
  # test is never retried here (inParallelRetry in tools/test/lib.mjs names the rare story retried and passed).
  retry:
    max: 1
    when: [runner_system_failure, stuck_or_timeout_failure, api_failure, scheduler_failure, data_integrity_failure]
  cache:
    - key: { files: [package-lock.json] }
      paths: [.npm/]
      policy: pull-push
    - key: node-and-chromium-v2
      paths: [.ci-home/]
    # One per job (matrix jobs included), so parallel jobs never overwrite each other's results.
    - key: results-$CI_JOB_NAME_SLUG
      paths: [.result-cache/]
  before_script:
    - !reference [.result-cache, check]
    # tools/setup.mjs keeps Node under $HOME/.local; a HOME inside the project lets the cache keep it between jobs.
    - export HOME="$CI_PROJECT_DIR/.ci-home" && mkdir -p "$HOME"
    # The image already has Node 26. Unzip only for a first Chromium download, when the cache doesn't have it yet.
    - |
      if [ "$SETUP_FLAGS" != --no-browsers ] && ! command -v unzip >/dev/null && ! ls "$PLAYWRIGHT_BROWSERS_PATH"/chromium-*/INSTALLATION_COMPLETE >/dev/null 2>&1; then
        apt-get update -qq && apt-get install -y -qq --no-install-recommends unzip >/dev/null
      fi
    - node tools/setup.mjs $SETUP_FLAGS
    - NODE_DIR="$(ls -d "$HOME"/.local/node-v*/bin 2>/dev/null | sort -V | tail -1 || true)"; if [ -n "$NODE_DIR" ]; then export PATH="$NODE_DIR:$PATH"; fi; node --version
    - |
      if [ "$CI_PIPELINE_SOURCE" = merge_request_event ]; then
        git fetch --quiet origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
        # SERUPA_WIDE=1: a merge request's suite runs whole, as main's does, rather than narrowed to what it changes.
        if [ "$SERUPA_WIDE" != 1 ]; then export SINCE="$CI_MERGE_REQUEST_DIFF_BASE_SHA"; fi
      fi
  after_script:
    - !reference [.result-cache, record]

# A job's result, by what it tested: the tree of the commit, the base a merge request is tested against, and the job.
# A pipeline started by hand (web) always runs everything, and so does a job whose output later jobs take
# (RESULT_CACHE: "off", build): a skipped build would leave them without dist/.
.result-cache:
  check:
    # Visual and Storybook shoot storybook-static, which no test file or other check script goes into (changesets do:
    # the Upgrading page renders them, GR284):
    # their key leaves those out, so a push that only fixes a test or a check doesn't shoot every story again.
    - |
      tree() {
        case "$GROUP" in
          visual|storybook) git ls-tree -r HEAD | grep -vP '\t(.*\.test\.tsx?|tools/test/vitest/.*|tools/test/(?!(lib|run|visual|storybook)\.mjs$)[^/]+\.mjs)$' | git hash-object --stdin ;;
          *) git rev-parse HEAD^{tree} ;;
        esac
      }
      export RESULT="$GROUP${SERUPA_PART:+-$SERUPA_PART}${SERUPA_SHARD:+-${SERUPA_SHARD%/*}}-$(tree)-${CI_MERGE_REQUEST_DIFF_BASE_SHA:-full}"
      mkdir -p .ci-home && echo "$RESULT" > .ci-home/result-key
    - find .result-cache -type f -mtime +14 -delete 2>/dev/null || true
    - |
      # The component test shards (base) always run: each writes its part of the coverage report the coverage job merges.
      if [ "$GROUP" = components ] && [ "$SERUPA_PART" = base ]; then export SERUPA_COVERAGE=1 RESULT_CACHE=off; fi
      if [ "$CI_PIPELINE_SOURCE" != web ] && [ "${RESULT_CACHE:-on}" = on ] && [ -f ".result-cache/$RESULT" ]; then
        echo "Passed on this same tree and base in job $(cat ".result-cache/$RESULT"); not running it again."
        exit 0
      fi
  record:
    # RESULT from check (before_script runs in the same shell as script; after_script doesn't, so it's in the file).
    - RESULT="$(cat .ci-home/result-key 2>/dev/null)"
    - if [ "$CI_JOB_STATUS" = success ] && [ -n "$RESULT" ]; then mkdir -p .result-cache && echo "$CI_JOB_URL" > ".result-cache/$RESULT"; fi

build:
  extends: .full-suite-or-cross
  stage: build
  timeout: 20m
  variables:
    SETUP_FLAGS: --no-browsers
    RESULT_CACHE: "off"
  script:
    - node tools/tokens/build.mjs --check
    - npm run build
    - npm run build-storybook
  artifacts:
    paths: [dist/, storybook-static/]
    expire_in: 3 days

types and lint:
  extends: .full-suite
  stage: build
  timeout: 20m
  variables:
    SETUP_FLAGS: --no-browsers
  script:
    - npm audit signatures
    # GitHub's dependency review, here: no dependency, shipped or dev, with a known high or critical advisory.
    - npm audit --audit-level=high
    - node tools/release.mjs --check
    - npm run typecheck
    - npm run lint

changeset:
  stage: build
  timeout: 10m
  rules:
    # A merge request that ships nothing new takes the "no-changeset" label, as on GitHub.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && ($SERUPA_CI_MODE == "runner" || $SERUPA_FULL_CI == "1") && $CI_MERGE_REQUEST_LABELS !~ /(^|,)no-changeset(,|$)/
  cache: []
  before_script: []
  script:
    - git fetch --quiet origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - node tools/changeset-check.mjs "$CI_MERGE_REQUEST_DIFF_BASE_SHA"

# A fix proves its test (tools/fix-proof.mjs): a merge request with a patch changeset that changes src/ must change a
# test that fails on the base commit's src/. Anything else passes in seconds, before the browser is used. A fix only
# the screenshots can show takes the "no-repro-test" label.
fix proof:
  stage: build
  timeout: 20m
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && ($SERUPA_CI_MODE == "runner" || $SERUPA_FULL_CI == "1") && $CI_MERGE_REQUEST_LABELS !~ /(^|,)no-repro-test(,|$)/
  after_script: []
  script:
    - git fetch --quiet origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - if node tools/fix-proof.mjs "$CI_MERGE_REQUEST_DIFF_BASE_SHA" --needed | grep -q '^needed=false'; then echo "Not a patch to src/, nothing to prove."; exit 0; fi
    - node tools/fix-proof.mjs "$CI_MERGE_REQUEST_DIFF_BASE_SHA"

.full-suite:
  rules:
    - if: $CI_PIPELINE_SOURCE == "web" || $SERUPA_FULL_CI == "1"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $SERUPA_CI_MODE == "runner"
    # The nightly run on main (the schedule): everything, unnarrowed, as the backstop for what a
    # merge request's narrowed run left out.
    - if: $CI_PIPELINE_SOURCE == "schedule"

# The cross-browser run needs build's dist/ and storybook-static/, and nothing else of the full suite.
.full-suite-or-cross:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE =~ /^(web|api|schedule)$/ || $SERUPA_FULL_CI == "1" || $SERUPA_CROSS == "1"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $SERUPA_CI_MODE == "runner"

local checks:
  stage: build
  timeout: 5m
  # Only the script and the description: a small image, one commit of history, no cache, no install.
  image: node:26-alpine
  variables:
    # The changeset check (below) reads the history back to the merge request's base.
    GIT_DEPTH: "0"
  # A draft MR gets no pipeline until its description holds a report, so it isn't red while the full check runs
  # locally (an hour or more). A ready MR always runs the gate, and fails without a report: whether GitLab requires
  # a passing pipeline to merge is a project setting nobody can check from here.
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $SERUPA_CI_MODE == "local" && $SERUPA_FULL_CI != "1" && ($CI_MERGE_REQUEST_DRAFT != "true" || $CI_MERGE_REQUEST_DESCRIPTION =~ /## Local checks/)
  cache: []
  before_script: []
  script:
    - node tools/local-checks-gate.mjs
    # The changeset check runs here too, so a report that left it out (no --since, --skip changeset) can't pass
    # without one. A merge request that ships nothing new takes the "no-changeset" label.
    - |
      if echo ",$CI_MERGE_REQUEST_LABELS," | grep -q ',no-changeset,'; then echo "no-changeset label: no changeset check."; else
        apk add --no-cache --quiet git >/dev/null && git fetch --quiet origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" && node tools/changeset-check.mjs "$CI_MERGE_REQUEST_DIFF_BASE_SHA"
      fi

suite:
  stage: test
  needs: [build]
  timeout: 30m
  # .full-suite's rules, except that on a merge request Visual and Storybook (eight jobs) exist only when it changes
  # something a story's picture or Storybook's pages are built from. Without that, they would each start, set up and
  # find nothing to shoot; GitLab also caps the jobs all waiting pipelines may hold, which every job counts towards.
  rules:
    - if: $CI_PIPELINE_SOURCE == "web" || $SERUPA_FULL_CI == "1"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $SERUPA_CI_MODE == "runner" && $GROUP =~ /^(checks|components)$/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $SERUPA_CI_MODE == "runner"
      changes:
        # What storybook-static is built from (src, docs and Storybook's setup, with the tools and files they import:
        # docs/blocks.tsx reads tokens.json, package.json, README.md, CHANGELOG.md and the changesets, the registry, the token
        # contrast pairs, the TypeScript API reader, the utilities and serupa-migrate's transforms), what shoots and
        # checks it, its baselines, and the pipeline itself.
        - src/**/*
        - docs/**/*
        - .storybook/**/*
        - design-tokens/**/*
        - tokens/**/*
        - tokens.css
        - tokens.json
        - fonts/**/*
        - package.json
        - package-lock.json
        - tsconfig.json
        - tsup.config.mjs
        - .nvmrc
        - README.md
        - CHANGELOG.md
        - .changeset/*.md
        - .gitlab-ci.yml
        - bin/migrate/**/*
        - tools/build/**/*
        - tools/tokens/**/*
        - tools/utilities/**/*
        - tools/typescript/**/*
        - tools/icons/**/*
        - tools/fonts/**/*
        - tools/setup.mjs
        - tools/test/lib.mjs
        - tools/test/run.mjs
        - tools/test/visual.mjs
        - tools/test/storybook.mjs
        - tools/test/baseline-visual/**/*
  # Tagged x86: the component tests, whose timing budgets were measured on x64, and Visual, whose baselines are drawn
  # with Chrome for Testing on x64. The other groups are in "suite portable", below.
  tags: [x86]
  parallel:
    matrix:
      # The component tests in three shards, and their second run in another language beside them (SERUPA_PART and
      # SERUPA_SHARD, run.mjs): about 3 minutes each rather than 13 in one job. The coverage job, below, merges theirs.
      - GROUP: components
        SERUPA_PART: base
        SERUPA_SHARD: [1/3, 2/3, 3/3]
      - GROUP: components
        SERUPA_PART: locale
      - GROUP: visual
        SERUPA_SHARD: [1/3, 2/3, 3/3]
  variables:
    SERUPA_COVERAGE: ""
  script:
    - set -o pipefail
    - node tools/test/run.mjs --group "$GROUP" ${SINCE:+--since "$SINCE"} 2>&1 | tee test-output.txt
  after_script:
    - !reference [.result-cache, record]
    # A passing job's artifacts are only the coverage blob; the rest is for looking into a failure.
    - if [ "$CI_JOB_STATUS" = success ]; then rm -rf .test-tmp test-output.txt; fi
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - test-output.txt
      - .test-tmp/
      - tools/test/baseline-visual/**/*.actual.png
      - .vitest/blob/
      - .vitest/narrowed

# Coverage of the component tests (V8, floors in vitest.config.ts): the three shards' blob reports merged into one
# (vitest --merge-reports), on every pipeline that runs them whole, so a drop fails the merge request, not main after it.
coverage:
  stage: test
  needs:
    - job: suite
      parallel:
        matrix:
          - GROUP: components
            SERUPA_PART: base
            SERUPA_SHARD: [1/3, 2/3, 3/3]
  timeout: 15m
  rules:
    - if: $CI_PIPELINE_SOURCE == "web" || $SERUPA_FULL_CI == "1"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"
    # Every merge request: a narrowed one's report covers the components it tests, and the check below asks only that
    # every function it adds runs in a test, so a merge can't take main under the floors (the floors run on whole runs).
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $SERUPA_CI_MODE == "runner"
  variables:
    RESULT_CACHE: "off"
  script:
    - if ! ls .vitest/blob/* >/dev/null 2>&1; then echo "No component tests ran, so there is no coverage to check."; exit 0; fi
    - if [ -f .vitest/narrowed ]; then echo "Narrowed run ($(tr '\n' ' ' < .vitest/narrowed)); the floors are checked on main's full run."; export SERUPA_NO_FLOORS=1; fi
    - node node_modules/vitest/vitest.mjs --merge-reports .vitest/blob --coverage
    - if [ -n "$SINCE" ]; then node tools/coverage-new-functions.mjs "$SINCE"; fi
  after_script:
    - node tools/test/vitest/coverage-summary.mjs || true
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - coverage/coverage-summary.json

# build (dist/ and storybook-static/ are the same files on either machine), fix proof (one test against the base), and
# the checks and the Storybook checks (axe in every theme, text spacing, 200% text, reflow): none takes a screenshot
# or has a timing budget, so they are untagged and go to whichever runner is free, x86 or Arm: the same image, the same
# rules, the same Chromium revision (on Arm, Playwright's own arm64 build, tools/setup.mjs).
suite portable:
  extends: suite
  tags: []
  parallel:
    matrix:
      - GROUP: checks
        SERUPA_SHARD: [1/3, 2/3, 3/3]
      - GROUP: storybook
        SERUPA_SHARD: [1/3, 2/3, 3/3]

# The package installed into an empty project on the oldest Node package.json allows, and the one between
# (tools/test/consumer.mjs). No npm ci: the repo's dependencies ask for Node 26, and the check needs only Node and dist/.
consumer:
  extends: .full-suite
  stage: test
  needs: [build]
  timeout: 20m
  image: node:${NODE}
  parallel:
    matrix:
      - NODE: ["22", "24"]
  cache: []
  before_script: []
  script:
    - node tools/test/consumer.mjs

# The packed build in a Next.js, a React Router and an Astro app, rendered on the server and hydrated in Chromium.
frameworks:
  extends: .full-suite
  stage: test
  needs: [build]
  timeout: 20m
  script:
    - node tools/test/frameworks.mjs

# Cross-browser (GitHub's nightly Cross-browser workflow): the component tests, the checks and the Storybook checks in
# Firefox and WebKit (Safari's engine), whose builds the Playwright image already has. A red job is a browser
# difference to look at, not a broken main, so nothing waits on it. Six jobs of up to an hour hold the runner's two
# slots from every lane's merge requests, so it never runs on its own: a pipeline started through the API (POST
# /projects/:id/pipeline, which a token with "Pipeline create" can do) or by a schedule runs build and this, nothing
# else; one started by hand from Build > Pipelines > Run pipeline runs it with SERUPA_CROSS=1. SERUPA_CROSS_GROUPS
# picks the groups (default: all four).
cross-browser:
  stage: test
  tags: [x86]
  needs: [build]
  timeout: 75m
  # A red job is a finding, not a broken pipeline: it doesn't cancel the other browser's jobs.
  allow_failure: true
  variables:
    # Firefox and WebKit come from the image's own browsers (the cached Chrome for Testing is Chromium only).
    PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
  # Only the groups SERUPA_CROSS_GROUPS names (a job left out costs nothing, not even its setup).
  rules:
    - if: ($CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == "schedule" || $SERUPA_CROSS == "1") && $GROUP == "checks" && $SERUPA_CROSS_GROUPS =~ /checks/
    - if: ($CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == "schedule" || $SERUPA_CROSS == "1") && $GROUP == "components" && $SERUPA_CROSS_GROUPS =~ /components/
    - if: ($CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == "schedule" || $SERUPA_CROSS == "1") && $GROUP == "storybook" && $SERUPA_CROSS_GROUPS =~ /storybook/
    # Visual in Firefox and WebKit: each story at rest in blue-light and on the other axes, against
    # tools/test/baseline-visual-<browser>/ (visual.mjs), in the default groups since those baselines are committed.
    # SERUPA_VISUAL_UPDATE=1 (with SERUPA_CROSS=1 and SERUPA_CROSS_GROUPS=visual, from Run pipeline) draws them instead,
    # into the job's artifacts, to review and commit.
    - if: ($CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == "schedule" || $SERUPA_CROSS == "1") && $GROUP == "visual" && $SERUPA_CROSS_GROUPS =~ /visual/
    # Every merge request: the component tests of the components it changes, in Firefox and WebKit; one that reaches
    # beyond the component folders passes without running (--narrowed-only) and is left to the nightly. Narrowed (the
    # browsers' own engines are slower, and Firefox runs one file at a time); the nightly runs them all.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $SERUPA_CI_MODE == "runner" && $GROUP == "components"
    # A merge request that changes pictures (a Chromium baseline, or a Firefox or WebKit one): Visual in Firefox and
    # WebKit too, narrowed like the suite's, and required, so their baselines move in the same merge request rather
    # than going stale until the nightly finds them. When it fails on purpose, tools/take-cross-baselines.mjs
    # <pipeline id> takes the pictures it drew; look at them and commit them.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $SERUPA_CI_MODE == "runner" && $GROUP == "visual"
      changes: [tools/test/baseline-visual/**/*, tools/test/baseline-visual-firefox/**/*, tools/test/baseline-visual-webkit/**/*]
      allow_failure: false
  parallel:
    matrix:
      - BROWSER: [firefox, webkit]
        GROUP: [checks, components, storybook, visual]
  script:
    # Metric-compatible fonts for the Arial and Times a test may ask for, as the GitHub workflow installed.
    - apt-get install -y -qq --no-install-recommends fonts-liberation >/dev/null 2>&1 || (apt-get update -qq && apt-get install -y -qq --no-install-recommends fonts-liberation >/dev/null)
    - set -o pipefail
    # On a merge request, the component tests run only narrowed (--narrowed-only, run.mjs): a change beyond the
    # component folders is left to the nightly. Visual there is narrowed the same way, but a wider change runs it whole.
    - NARROW=""
    - if [ -n "$CI_MERGE_REQUEST_DIFF_BASE_SHA" ]; then NARROW="--since $CI_MERGE_REQUEST_DIFF_BASE_SHA"; fi
    - if [ -n "$NARROW" ] && [ "$GROUP" = components ]; then NARROW="$NARROW --narrowed-only"; fi
    - node tools/test/run.mjs --browser "$BROWSER" --group "$GROUP" $NARROW ${SERUPA_VISUAL_UPDATE:+--update} 2>&1 | tee test-output.txt
  after_script:
    - grep -E -A1 '^\s*FAIL' test-output.txt | grep -v '^--$' | head -150 || true
    - if [ "$GROUP" = visual ] && [ "$CI_JOB_STATUS" != success ]; then echo "If these pictures changed on purpose, take them with GITLAB_TOKEN=… node tools/take-cross-baselines.mjs $CI_PIPELINE_ID, look at them and commit them."; fi
  artifacts:
    when: always
    expire_in: 14 days
    paths: [test-output.txt, tools/test/baseline-visual-firefox/, tools/test/baseline-visual-webkit/]

# Nightly (the schedule on main, 02:00 Jakarta; Build > Pipeline schedules). Besides the whole suite above:
# Mutation testing (tools/test/mutation.mjs --rotate): five components picked by the day, then every src/internal file
# with a test; a score below tools/test/baseline-mutation.json fails, and the survivors it prints are tests to write.
mutation:
  stage: test
  tags: [x86]
  needs: []
  timeout: 2h
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  # Six shards side by side (SERUPA_SHARD, mutation.mjs): thirty components a night rather than five, and every
  # src/internal file, each shard within its 100 minutes.
  parallel: 6
  variables:
    SERUPA_SHARD: $CI_NODE_INDEX/$CI_NODE_TOTAL
  after_script: []
  script:
    - node tools/test/mutation.mjs --rotate --minutes 100 --json mutation.json
  artifacts:
    when: always
    expire_in: 30 days
    paths: [mutation.json]

# Benchmarks over time (tools/test/bench.mjs): the mount-time and INP tests twice into one folder, then compared with
# the last night's that passed (kept in the cache), so a story that slowly gets slower shows up on one night.
benchmarks:
  stage: test
  tags: [x86]
  needs: []
  timeout: 45m
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  cache:
    - key: { files: [package-lock.json] }
      paths: [.npm/]
    - key: node-and-chromium-v2
      paths: [.ci-home/]
    - key: bench-history
      paths: [.bench-history/]
  after_script: []
  script:
    - for i in 1 2; do SERUPA_BENCH=.bench npx vitest run --project components --no-file-parallelism src/internal/mountTime.test.tsx src/internal/inp.test.tsx; done
    - if [ -f .bench-history/last.json ]; then PREVIOUS="--previous .bench-history/last.json"; fi
    - node tools/test/bench.mjs .bench --json bench.json $PREVIOUS
    - mkdir -p .bench-history && cp bench.json .bench-history/last.json
  artifacts:
    when: always
    expire_in: 30 days
    paths: [bench.json]

# Canary (GitHub's nightly Canary workflow, J4): the types against TypeScript's next version, and the component tests
# and the consumer check against React's canary, so a change coming in either shows up a night after it lands there.
.nightly:
  stage: test
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  after_script: []

canary types:
  extends: .nightly
  timeout: 20m
  variables:
    SETUP_FLAGS: --no-browsers
  script:
    - npm install --no-save --ignore-scripts typescript@next
    - echo "TypeScript $(npx tsc -v)"
    - npm run typecheck

canary components:
  extends: .nightly
  tags: [x86]
  timeout: 45m
  script:
    - npm install --no-save --ignore-scripts --legacy-peer-deps react@canary react-dom@canary
    - echo "React $(node -p "require('react/package.json').version")"
    - npm run build
    - npm run test:unit

canary consumer:
  extends: .nightly
  timeout: 20m
  variables:
    SETUP_FLAGS: --no-browsers
  script:
    - npm run build
    - node tools/test/consumer.mjs --react canary

# Flake hunt: the component tests and the checks twice more on main, every night, when the runners are idle. A test
# that fails once in three runs on an unchanged tree is a flake to fix before it stops someone's merge request.
flake hunt:
  extends: .nightly
  tags: [x86]
  timeout: 90m
  parallel:
    matrix:
      - GROUP: [components, checks]
  script:
    - npm run build && npm run build-storybook
    - set -o pipefail
    - for i in 1 2; do node tools/test/run.mjs --group "$GROUP" 2>&1 | tee -a test-output.txt; done
  artifacts:
    when: on_failure
    expire_in: 7 days
    paths: [test-output.txt]

# The software bill of materials (CycloneDX), every night: what the package depends on, at which versions and
# licenses, for anyone who audits it. tools/test/licenses.mjs already fails a dependency whose license isn't allowed.
sbom:
  extends: .nightly
  timeout: 10m
  variables:
    SETUP_FLAGS: --no-browsers
  script:
    - npm sbom --sbom-format cyclonedx --omit dev > sbom.cdx.json
  artifacts:
    expire_in: 90 days
    paths: [sbom.cdx.json]

# Security scanning in place of GitHub's CodeQL: GitLab's secret detection on every merge request (a key or token
# committed by mistake, in seconds), and its SAST (Semgrep's rules for JavaScript and TypeScript) on main after a
# merge and every night. Their images bring their own tools, so none of the setup above.
include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/SAST.gitlab-ci.yml

secret_detection:
  tags: [x86]
  before_script: []
  after_script: []
  cache: []
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || ($CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH)

semgrep-sast:
  tags: [x86]
  before_script: []
  after_script: []
  cache: []
  needs: []
  rules:
    - if: ($CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH) || ($CI_PIPELINE_SOURCE == "schedule")

# Every SAST analyzer the template may add (only Semgrep's applies to this repo).
.sast-analyzer:
  tags: [x86]
  before_script: []
  after_script: []
  cache: []
  needs: []

# Size over time (tools/test/size.mjs --previous): tonight's bundle sizes against last night's, kept in the cache as
# the benchmarks' are, so a package that grows a little with every merge shows it on the night it grows.
size trend:
  extends: .nightly
  timeout: 20m
  variables:
    SETUP_FLAGS: --no-browsers
  cache:
    - key: { files: [package-lock.json] }
      paths: [.npm/]
    - key: node-and-chromium-v2
      paths: [.ci-home/]
    - key: size-history
      paths: [.size-history/]
  script:
    - npm run build
    - if [ -f .size-history/last.json ]; then PREVIOUS="--previous .size-history/last.json"; fi
    - node tools/test/size.mjs --json size.json $PREVIOUS
    - mkdir -p .size-history && cp size.json .size-history/last.json
  artifacts:
    when: always
    expire_in: 30 days
    paths: [size.json]

# Design QA (96, GitHub's Design QA workflow): a merge request that changes pictures gets the review sheet, each
# changed story in all six themes before and after, linked to GitLab's raw files. It's in the job's log and in
# design-qa.md (Browse the job's artifacts, or "Design QA" on the merge request). It only shows; it never fails.
design qa:
  stage: build
  needs: []
  timeout: 15m
  image: node:26-alpine
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $SERUPA_CI_MODE == "runner"
      changes: [tools/test/baseline-visual/**/*]
  cache: []
  before_script: []
  after_script: []
  script:
    - apk add --no-cache git >/dev/null
    - git fetch --quiet origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - node tools/design-qa.mjs "$CI_MERGE_REQUEST_DIFF_BASE_SHA" | tee design-qa.md
  artifacts:
    expose_as: Design QA
    expire_in: 30 days
    paths: [design-qa.md]

# Dependency updates (Renovate, in place of GitHub's Dependabot; its rules are in renovate.json): nightly, once a
# GitLab token is saved as the masked CI/CD variable RENOVATE_TOKEN. Each update is a merge request through the
# same pipeline as any other.
renovate:
  extends: .nightly
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $RENOVATE_TOKEN
  timeout: 30m
  image: renovate/renovate:41
  variables:
    RENOVATE_PLATFORM: gitlab
    RENOVATE_ENDPOINT: $CI_API_V4_URL
    RENOVATE_REPOSITORIES: $CI_PROJECT_PATH
    RENOVATE_ONBOARDING: "false"
    RENOVATE_REQUIRE_CONFIG: required
    LOG_LEVEL: info
  cache: []
  before_script: []
  script:
    - renovate
