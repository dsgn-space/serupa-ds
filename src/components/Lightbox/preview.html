<!doctype html>
<html>
<head><meta charset="utf-8"><title>Lightbox — preview</title>
<style>
  body { margin: 0; padding: 16px; background: var(--surface); color: var(--text); font-family: var(--font-sans); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var T = window.Serupa, h = React.createElement;
  var pic = function (a, b) { return 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500"><rect width="800" height="500" fill="' + a + '"/><rect y="300" width="800" height="200" fill="' + b + '"/></svg>'); };
  ReactDOM.createRoot(document.getElementById('root')).render(h(T.Lightbox, { defaultOpen: true, defaultIndex: 1, items: [
    { src: pic('#bae6fd', '#0369a1'), alt: 'The sea under a pale sky', width: 800, height: 500 },
    { src: pic('#fef3c7', '#65a30d'), alt: 'A green field under a yellow sky', caption: 'Rice fields near Ubud', width: 800, height: 500 },
    { src: pic('#e0e7ff', '#4338ca'), alt: 'A blue evening', width: 800, height: 500 }
  ] }));
</script>
</body>
</html>
