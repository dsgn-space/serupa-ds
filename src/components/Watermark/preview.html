<!doctype html>
<html>
<head><meta charset="utf-8"><title>Watermark — preview</title>
<style>
  body { margin: 0; padding: 16px; background: var(--surface); color: var(--text); font-family: var(--font-sans); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var T = window.Serupa, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h(T.Watermark, { text: ['Ada Lovelace', 'ada@example.com'] },
      h('p', null, 'Your salary for November was paid into your account on 25 November.'))
  );
</script>
</body>
</html>
