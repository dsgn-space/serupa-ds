<!doctype html>
<html>
<head><meta charset="utf-8"><title>Countdown — preview</title>
<style>
  body { margin: 0; padding: 16px; background: var(--surface); color: var(--text); font-family: var(--font-sans); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var T = window.Serupa, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('p', null, 'Offer ends in ', h(T.Countdown, { to: Date.now() + 5 * 60000, label: 'Offer ends in' })));
</script>
</body>
</html>
