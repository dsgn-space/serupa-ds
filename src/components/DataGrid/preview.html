<!doctype html>
<html>
<head><meta charset="utf-8"><title>DataGrid — preview</title>
<style>
  body { margin: 0; padding: 16px; background: var(--surface); color: var(--text); font-family: var(--font-sans); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var T = window.Serupa, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(T.DataGrid, { 'aria-label': 'Stock', columns: [{ key: 'name', header: 'Name' }, { key: 'qty', header: 'Qty', align: 'end' }], rows: [{ id: 'a', name: 'Kopi', qty: 4 }, { id: 'b', name: 'Teh', qty: 9 }] }));
</script>
</body>
</html>
