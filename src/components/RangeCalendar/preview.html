<!doctype html>
<html>
<head><meta charset="utf-8"><title>RangeCalendar — preview</title>
<style>
  body { margin: 0; padding: 16px; background: var(--surface); color: var(--text); font-family: var(--font-sans); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var T = window.Serupa, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(T.RangeCalendar, { months: 2, defaultValue: { start: '2026-11-03', end: '2026-11-08' } }));
</script>
</body>
</html>
