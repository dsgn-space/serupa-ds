<!doctype html>
<html>
<head><meta charset="utf-8"><title>IconTile — preview</title>
<style>
  body { margin: 0; padding: 16px; background: var(--surface); color: var(--text); font-family: var(--font-sans); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var T = window.Serupa, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { style: { display: 'flex', gap: 12, alignItems: 'flex-end' } },
    h(T.IconTile, { icon: 'cloud_done', tone: 'primary' }), h(T.IconTile, { icon: 'check_circle', tone: 'success', size: 'lg' }),
    h(T.IconTile, { icon: 'warning', tone: 'warning', size: 'sm' }), h(T.IconTile, { icon: 'person', shape: 'circle', size: 'xl' })));
</script>
</body>
</html>
