<!doctype html>
<html>
<head><meta charset="utf-8"><title>CodeBlock — preview</title>
<style>
  body { margin: 0; padding: 16px; background: var(--surface); color: var(--text); font-family: var(--font-sans); max-width: 640px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var T = window.Serupa, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(T.CodeBlock, { title: 'Install', language: 'sh', lineNumbers: true, highlight: [2], code: 'npm install serupa-ds\nnpx serupa-brand acme "#0f766e" -o src/acme-theme.css' }));
</script>
</body>
</html>
