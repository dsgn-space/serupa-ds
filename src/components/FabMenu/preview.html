<!doctype html>
<html>
<head><meta charset="utf-8"><title>FabMenu — preview</title>
<style>
  body { margin: 0; padding: 16px; background: var(--surface); color: var(--text); font-family: var(--font-sans); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var T = window.Serupa, h = React.createElement;
  var actions = [{ label: 'New document', icon: 'description', onSelect: function () {} }, { label: 'New folder', icon: 'create_new_folder', onSelect: function () {} }, { label: 'Upload a file', icon: 'upload', onSelect: function () {} }];
  ReactDOM.createRoot(document.getElementById('root')).render(h(T.FabMenu, { icon: 'add', label: 'Create', actions: actions }));
</script>
</body>
</html>
