<!doctype html>
<html>
<head><meta charset="utf-8"><title>Kanban — preview</title>
<style>
  body { margin: 0; padding: 16px; background: var(--surface); color: var(--text); font-family: var(--font-sans); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var T = window.Serupa, h = React.createElement;
  function Board() {
    var s = React.useState([
      { id: 'todo', title: 'To do', items: [{ id: 'a', t: 'Fix login' }, { id: 'b', t: 'Release notes' }] },
      { id: 'doing', title: 'In progress', limit: 1, items: [{ id: 'c', t: 'Dark charts' }] },
      { id: 'done', title: 'Done', items: [] }]);
    return h(T.Kanban, { 'aria-label': 'Sprint', columns: s[0], getKey: function (x) { return x.id; }, getLabel: function (x) { return x.t; }, renderCard: function (x) { return x.t; }, onMove: s[1] });
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Board));
</script>
</body>
</html>
