<!doctype html>
<html>
<head><meta charset="utf-8"><title>SplitButton — preview</title>
<style>
  body { margin: 0; padding: 16px; background: var(--surface); color: var(--text); font-family: var(--font-sans); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var T = window.Serupa, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(T.SplitButton, { menuLabel: 'More publish options', menu: [h(T.MenuItem, { key: 's' }, 'Schedule'), h(T.MenuItem, { key: 'd' }, 'Save as draft')] }, 'Publish'));
</script>
</body>
</html>
