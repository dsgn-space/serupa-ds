<!doctype html>
<html>
<head><meta charset="utf-8"><title>Form — preview</title>
<style>
  body { margin: 0; padding: 16px; background: var(--surface); color: var(--text); font-family: var(--font-sans); }
  .dk-form { max-width: 420px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  // Without a schema, the controls' own constraints are checked: leave a field empty and submit to see the summary.
  var T = window.Serupa, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(T.Form, { 'aria-label': 'Sign up', onSubmit: function () { return new Promise(function (r) { setTimeout(r, 800); }); } },
    h(T.Field, { label: 'Full name', required: true }, h(T.Input, { name: 'name', required: true, autoComplete: 'name' })),
    h(T.Field, { label: 'Email', hint: 'Like name@example.com', required: true }, h(T.Input, { name: 'email', type: 'email', required: true, autoComplete: 'email' })),
    h(T.Field, { label: 'Company', optional: true }, h(T.Input, { name: 'company' })),
    h('div', null, h(T.Button, { type: 'submit' }, 'Create account'))
  ));
</script>
</body>
</html>
