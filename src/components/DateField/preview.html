<!doctype html>
<html>
<head><meta charset="utf-8"><title>DateField — preview</title>
<style>
  body { margin: 0; padding: 16px; background: var(--surface); color: var(--text); font-family: var(--font-sans); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var T = window.Serupa, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(T.DateField, { 'aria-label': 'Date of birth', autoComplete: 'bday' }));
</script>
</body>
</html>
