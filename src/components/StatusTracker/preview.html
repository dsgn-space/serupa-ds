<!doctype html>
<html>
<head><meta charset="utf-8"><title>StatusTracker — preview</title>
<style>
  body { margin: 0; padding: 16px; background: var(--surface); color: var(--text); font-family: var(--font-sans); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var T = window.Serupa, h = React.createElement;
  var days = []; for (var i = 0; i < 90; i++) days.push({ date: new Date(2026, 7, 9 + i), state: i < 5 ? 'none' : i === 20 || i === 61 ? 'degraded' : i === 47 ? 'down' : 'up' });
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { style: { maxWidth: 640 } }, h(T.StatusTracker, { label: 'API', days: days })));
</script>
</body>
</html>
