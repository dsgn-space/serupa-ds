<!-- Actions -->
<div style="max-width:420px">
<span class="dk-textarea dk-textarea--size-md dk-textarea--resize-none dk-textarea--auto dk-textarea--actions" data-component="textarea" data-size="md">
<textarea placeholder="Add a comment" aria-label="Comment" maxLength="2000" aria-describedby="dk-ta_R_0_" rows="2" class="dk-textarea__field" style="--dk-ta-rows:2;--dk-ta-max-rows:8">
</textarea>
<fieldset class="dk-textarea__actions" role="none">
<span class="dk-textarea__count" id="dk-ta_R_0_">0 / 2000</span>
<button aria-label="Attach a file" data-shape="square" title="Attach a file" data-component="button" data-variant="ghost" data-size="sm" data-icon-only="" type="button" class="dk-btn dk-btn--ghost dk-btn--size-sm dk-btn--icon-only dk-icon-btn">
<span class="dk-btn__icon dk-btn__icon--only" aria-hidden="true">
<span aria-hidden="true" data-icon="attach_file" class="dk-icon">
</span>
</span>
</button>
<button data-component="button" data-variant="primary" data-size="sm" type="button" class="dk-btn dk-btn--primary dk-btn--size-sm">
<span class="dk-btn__label">Comment</span>
</button>
</fieldset>
</span>
</div>

<!-- AutoResize -->
<div style="max-width:420px">
<span class="dk-textarea dk-textarea--size-md dk-textarea--resize-none dk-textarea--auto" data-component="textarea" data-size="md">
<textarea placeholder="Grows as you type, up to 6 lines" aria-label="Message" rows="3" class="dk-textarea__field" style="--dk-ta-rows:3;--dk-ta-max-rows:6">
</textarea>
</span>
</div>

<!-- Count -->
<div style="max-width:420px">
<span class="dk-textarea dk-textarea--size-md" data-component="textarea" data-size="md">
<textarea placeholder="Tell us more" aria-label="Message" maxLength="280" aria-describedby="dk-ta_R_0_" rows="3" class="dk-textarea__field">A short note</textarea>
<span class="dk-textarea__count" id="dk-ta_R_0_">12 / 280</span>
</span>
</div>

<!-- LongText -->
<div style="max-width:420px">
<div style="width:220px">
<span class="dk-textarea dk-textarea--size-md" data-component="textarea" data-size="md">
<textarea placeholder="Tell us more" aria-label="Message" maxLength="280" aria-describedby="dk-ta_R_0_" rows="3" class="dk-textarea__field">Please call before delivery. Donaudampfschifffahrtsgesellschaftskapitänskajüte is the building at the end of the lane, past the second gate.</textarea>
<span class="dk-textarea__count" id="dk-ta_R_0_">140 / 280</span>
</span>
</div>
</div>

<!-- Playground -->
<div style="max-width:420px">
<span class="dk-textarea dk-textarea--size-md" data-component="textarea" data-size="md">
<textarea placeholder="Tell us more" aria-label="Message" rows="3" class="dk-textarea__field">
</textarea>
</span>
</div>

<!-- States -->
<div style="max-width:420px">
<div class="flex flex-col gap-3">
<span class="dk-textarea dk-textarea--size-md dk-textarea--invalid" data-component="textarea" data-size="md">
<textarea aria-label="Invalid" aria-invalid="true" rows="3" class="dk-textarea__field">Too short</textarea>
</span>
<span class="dk-textarea dk-textarea--size-md dk-textarea--readonly" data-component="textarea" data-size="md">
<textarea aria-label="Read-only" readOnly="" rows="3" class="dk-textarea__field">Read-only</textarea>
</span>
<span class="dk-textarea dk-textarea--size-md dk-textarea--disabled" data-component="textarea" data-size="md">
<textarea aria-label="Disabled" disabled="" rows="3" class="dk-textarea__field">Disabled</textarea>
</span>
</div>
</div>
