<!-- Actions -->
<div style="max-width:420px">
<span class="srp-textarea srp-textarea--size-md srp-textarea--resize-none srp-textarea--auto srp-textarea--actions" data-component="textarea" data-size="md">
<textarea placeholder="Add a comment" aria-label="Comment" maxLength="2000" aria-describedby="srp-ta_R_0_" rows="2" class="srp-textarea__field" style="--srp-ta-rows:2;--srp-ta-max-rows:8">
</textarea>
<fieldset class="srp-textarea__actions" role="none">
<span class="srp-textarea__count" id="srp-ta_R_0_">0 / 2000</span>
<button aria-label="Attach a file" data-shape="square" aria-labelledby="srp-tip_R_1n_" interestfor="srp-tip_R_1n_" data-component="button" data-variant="ghost" data-size="sm" data-icon-only="" type="button" class="srp-btn srp-btn--ghost srp-btn--size-sm srp-btn--icon-only srp-icon-btn">
<span class="srp-btn__icon srp-btn__icon--only" aria-hidden="true">
<span aria-hidden="true" data-icon="attach_file" class="srp-icon">
</span>
</span>
</button>
<span id="srp-tip_R_1n_" role="tooltip" popover="manual" hidden="" class="srp-tooltip" data-component="tooltip" data-state="closed">Attach a file</span>
<button data-component="button" data-variant="primary" data-size="sm" type="button" class="srp-btn srp-btn--primary srp-btn--size-sm">
<span class="srp-btn__label">Comment</span>
</button>
</fieldset>
</span>
</div>

<!-- AutoResize -->
<div style="max-width:420px">
<span class="srp-textarea srp-textarea--size-md srp-textarea--resize-none srp-textarea--auto" data-component="textarea" data-size="md">
<textarea placeholder="Grows as you type, up to 6 lines" aria-label="Message" rows="3" class="srp-textarea__field" style="--srp-ta-rows:3;--srp-ta-max-rows:6">
</textarea>
</span>
</div>

<!-- Count -->
<div style="max-width:420px">
<span class="srp-textarea srp-textarea--size-md" data-component="textarea" data-size="md">
<textarea placeholder="Tell us more" aria-label="Message" maxLength="280" aria-describedby="srp-ta_R_0_" rows="3" class="srp-textarea__field" style="--srp-ta-rows:3">A short note</textarea>
<span class="srp-textarea__count" id="srp-ta_R_0_">12 / 280</span>
</span>
</div>

<!-- DoSizeRows -->
<div style="max-width:420px">
<span class="srp-textarea srp-textarea--size-md" data-component="textarea" data-size="md">
<textarea placeholder="What happened, and what did you expect?" aria-label="Describe the problem" rows="5" class="srp-textarea__field" style="--srp-ta-rows:5">
</textarea>
</span>
</div>

<!-- DontOneRow -->
<div style="max-width:420px">
<span class="srp-textarea srp-textarea--size-md" data-component="textarea" data-size="md">
<textarea placeholder="What happened, and what did you expect?" aria-label="Describe the problem" rows="1" class="srp-textarea__field" style="--srp-ta-rows:1">
</textarea>
</span>
</div>

<!-- LongText -->
<div style="max-width:420px">
<div style="width:220px">
<span class="srp-textarea srp-textarea--size-md" data-component="textarea" data-size="md">
<textarea placeholder="Tell us more" aria-label="Message" maxLength="280" aria-describedby="srp-ta_R_0_" rows="3" class="srp-textarea__field" style="--srp-ta-rows:3">Please call before delivery. Donaudampfschifffahrtsgesellschaftskapitänskajüte is the building at the end of the lane, past the second gate.</textarea>
<span class="srp-textarea__count" id="srp-ta_R_0_">140 / 280</span>
</span>
</div>
</div>

<!-- Playground -->
<div style="max-width:420px">
<span class="srp-textarea srp-textarea--size-md" data-component="textarea" data-size="md">
<textarea placeholder="Tell us more" aria-label="Message" rows="3" class="srp-textarea__field" style="--srp-ta-rows:3">
</textarea>
</span>
</div>

<!-- States -->
<div style="max-width:420px">
<div class="flex flex-col gap-3">
<span class="srp-textarea srp-textarea--size-md srp-textarea--invalid" data-component="textarea" data-size="md">
<textarea aria-label="Invalid" aria-invalid="true" rows="3" class="srp-textarea__field" style="--srp-ta-rows:3">Too short</textarea>
</span>
<span class="srp-textarea srp-textarea--size-md srp-textarea--readonly" data-component="textarea" data-size="md">
<textarea aria-label="Read-only" readOnly="" rows="3" class="srp-textarea__field" style="--srp-ta-rows:3">Read-only</textarea>
</span>
<span class="srp-textarea srp-textarea--size-md srp-textarea--disabled" data-component="textarea" data-size="md">
<textarea aria-label="Disabled" disabled="" rows="3" class="srp-textarea__field" style="--srp-ta-rows:3">Disabled</textarea>
</span>
</div>
</div>
