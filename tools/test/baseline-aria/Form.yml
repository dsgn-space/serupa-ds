# AsyncCheck
- form "Create an account":
  - text: Username Lowercase letters, numbers and _
  - textbox "Username"
  - button "Save"

# Default
- form "Create an account":
  - text: Full name
  - textbox "Full name"
  - text: Email Like name@example.com
  - textbox "Email"
  - text: Password 12 characters or more
  - textbox "Password"
  - button "Show password"
  - text: Confirm password
  - textbox "Confirm password"
  - button "Show confirmed password"
  - checkbox "I agree to the terms"
  - text: I agree to the terms
  - button "Create account"

