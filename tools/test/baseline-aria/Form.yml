# RepeatableGroups
- form "Create an account":
  - text: Team name
  - textbox "Team name": Design
  - group "People to invite":
    - text: People to invite Up to 5
    - list:
      - listitem:
        - group "Person 1":
          - text: Email of person 1
          - textbox "Email of person 1": ani@example.com
    - button "Add another person"
  - button "Send invitations"

# ServerErrors
- form "Create an account":
  - alert: Nothing was sent. Check the problems below.
  - heading "There is a problem" [level=2]
  - list:
    - listitem:
      - link "That email already has an account. Sign in instead":
        - /url: "#dk-f_id1_-control"
  - text: Full name
  - textbox "Full name": Ani Wijaya
  - text: Email Like name@example.com
  - textbox "Email" [invalid]: ani@example.com
  - text: That email already has an account. Sign in instead Password 12 characters or more
  - textbox "Password"
  - button "Show password"
  - text: Confirm password
  - textbox "Confirm password"
  - button "Show confirmed password"
  - checkbox "I agree to the terms"
  - text: I agree to the terms
  - button "Create account"

