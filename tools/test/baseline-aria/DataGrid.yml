# Edit
- grid "Stock":
  - rowgroup:
    - row "SKU Product In stock Price (Rp)":
      - columnheader "SKU"
      - columnheader "Product"
      - columnheader "In stock"
      - columnheader "Price (Rp)"
  - rowgroup:
    - row "KP-001 Kopi Toraja 250 g 42 85.000":
      - gridcell "KP-001" [selected]
      - gridcell "Kopi Toraja 250 g"
      - gridcell "42"
      - gridcell "85.000"
    - row "KP-002 Kopi Gayo 250 g 18 92.000":
      - gridcell "KP-002"
      - gridcell "Kopi Gayo 250 g"
      - gridcell "18"
      - gridcell "92.000"
    - row "TH-010 Teh Melati 100 g 120 24.000":
      - gridcell "TH-010"
      - gridcell "Teh Melati 100 g"
      - gridcell "120"
      - gridcell "24.000"
    - row "GL-005 Gula Aren 500 g 0 38.000":
      - gridcell "GL-005"
      - gridcell "Gula Aren 500 g"
      - gridcell "0"
      - gridcell "38.000"
    - row "MD-020 Madu Hutan 350 ml 9 110.000":
      - gridcell "MD-020"
      - gridcell "Madu Hutan 350 ml"
      - gridcell "9"
      - gridcell "110.000"

